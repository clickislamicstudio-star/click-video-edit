<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click v1.1 - Import + Waveform - 26 Files</title>
<meta name="theme-color" content="#FF3B30">
<style>
  *{margin:0;padding:0;box-sizing:border-box}body{background:#0E0E0E;color:white;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
  header{background:#1A1A1A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header h1{color:#FF3B30;font-size:18px}.btn{background:#2A2A2A;color:white;border:none;padding:8px 16px;border-radius:20px}.btn-primary{background:#FF3B30}
  #playerArea{flex:1;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}#importBtn{background:#FF3B30;color:white;border:none;padding:16px 32px;border-radius:30px;font-size:18px;margin:20px;cursor:pointer}
  #timelineArea{height:130px;background:#1E1E1E;padding:10px}.track{height:28px;background:#2A2A2A;border-radius:6px;margin:4px 0;padding:0 10px;display:flex;align-items:center;font-size:12px;color:#888}
  #toolbar{background:#1A1A1A;padding:10px;overflow-x:auto;white-space:nowrap}.tool-btn{background:transparent;border:none;color:white;padding:8px 12px;min-width:60px}
  #badge{position:fixed;top:60px;right:10px;background:#4CAF50;color:white;padding:6px 12px;border-radius:20px;font-size:11px;z-index:100}
</style>
</head>
<body>
<header><h1>Click Editor v1.1 - 26 Files</h1><div><button class="btn" id="langBtn">EN</button><button class="btn btn-primary" id="exportBtn">Export</button></div></header>
<div id="playerArea">
  <h2 style="color:#FF3B30">📁 Import Media to Start</h2>
  <button id="importBtn">📁 Import Video/Audio</button>
  <p style="color:#888;font-size:12px;">Gallery -> Timeline V1 + Waveform</p>
  <div id="waveformPreview" style="width:90%;height:60px;background:#1E1E1E;border-radius:8px;margin-top:15px;display:none;"><canvas id="waveCanvas" width="300" height="60" style="width:100%;height:100%"></canvas></div>
  <div id="status" style="margin-top:15px;color:#4CAF50;font-size:12px;"></div>
  <div id="badge">Checking 26 Files...</div>
</div>
<div id="timelineArea">
  <div class="track" id="trackV1">V1 Main - No clips yet. Import to add.</div>
  <div class="track" id="trackA1">A1 Audio - Waveform will show here</div>
</div>
<div id="toolbar"><div>
<button class="tool-btn">✂️ Trim</button><button class="tool-btn">⚡ Speed</button><button class="tool-btn">T Text</button><button class="tool-btn">🎨 Filter</button><button class="tool-btn">🎵 Audio</button><button class="tool-btn">💬 Captions</button>
</div></div>

<script src="js/core/math.js?v=14"></script><script src="js/core/snap-engine.js?v=14"></script><script src="js/core/transform.js?v=14"></script><script src="js/core/keyframe.js?v=14"></script><script src="js/core/i18n.js?v=14"></script><script src="js/core/waveform.js?v=14"></script><script src="js/store.js?v=14"></script><script src="js/hardware.js?v=14"></script><script src="js/timeline/clip.js?v=14"></script><script src="js/timeline/timeline.js?v=14"></script><script src="js/timeline/gesture.js?v=14"></script><script src="js/timeline/selection.js?v=14"></script><script src="js/player/player.js?v=14"></script><script src="js/player/renderer.js?v=14"></script><script src="js/tools/trim-split.js?v=14"></script><script src="js/tools/speed.js?v=14"></script><script src="js/tools/text.js?v=14"></script><script src="js/tools/filter.js?v=14"></script><script src="js/tools/masking.js?v=14"></script><script src="js/tools/chroma.js?v=14"></script><script src="js/tools/audio.js?v=14"></script><script src="js/tools/effects.js?v=14"></script><script src="js/tools/captions.js?v=14"></script><script src="js/tools/media-import.js?v=14"></script><script src="js/export/export.js?v=14"></script><script src="js/app.js?v=14"></script>

<script>
const importBtn=document.getElementById('importBtn');const status=document.getElementById('status');
importBtn?.addEventListener('click', async ()=>{
  status.textContent='Opening Gallery...';
  try{
    const clips=await MediaImportTool.importToTimeline();
    const trackV1=document.getElementById('trackV1');
    if(trackV1&&clips.length>0){
      trackV1.innerHTML=clips.map(c=>`<div style="background:#FF3B30;color:white;padding:4px 8px;border-radius:4px;margin:2px;font-size:10px;">${c.name.substr(0,15)} ${c.duration.toFixed(1)}s</div>`).join('');
      status.textContent=`✅ Imported ${clips.length} clips!`;
      if(clips[0].waveform){
        const preview=document.getElementById('waveformPreview');const canvas=document.getElementById('waveCanvas');
        if(preview&&canvas){preview.style.display='block';WaveformEngine.drawWaveform(canvas,clips[0].waveform,'#FF3B30');}
      }
    } else {status.textContent='❌ No file selected';}
  }catch(e){status.textContent='❌ Error: '+e.message;console.error(e);}
});
setTimeout(()=>{const all=['TimelineMath','SnapEngine','TransformEngine','KeyframeEngine','I18n','WaveformEngine','Store','HardwareDetector','Clip','Timeline','Gesture','Selection','Player','Renderer','TrimSplitTool','SpeedTool','TextTool','FilterTool','MaskingTool','ChromaTool','AudioTool','EffectsTool','CaptionsTool','MediaImportTool','ExportEngine','App'];const missing=all.filter(n=>typeof window[n]==='undefined');const badge=document.getElementById('badge');if(missing.length===0){badge.textContent='✅ 26 Files - v1.1 Ready!';badge.style.background='#4CAF50';}else{badge.textContent='❌ Missing: '+missing.join(',');badge.style.background='#FF3B30';console.log('Missing',missing);}},1500);
</script>
</body>
</html>
