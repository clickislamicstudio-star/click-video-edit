<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Video Editor - Phase 2 Test</title>
<style>
  body { background: #0E0E0E; color: white; font-family: sans-serif; padding: 20px; }
  .log { background: #1E1E1E; padding: 12px; margin: 10px 0; border-radius: 8px; font-family: monospace; }
  .pass { color: #4CAF50; border-left: 3px solid #4CAF50; }
  .fail { color: #FF3B30; border-left: 3px solid #FF3B30; }
  h3 { color: #FF3B30; margin-top: 25px; }
</style>
</head>
<body>
<h2>Click Video Editor - Phase 2 Test (6 Files)</h2>
<div id="logs"></div>

<script src="js/core/math.js?v=4"></script>
<script src="js/core/snap-engine.js?v=4"></script>
<script src="js/core/transform.js?v=4"></script>
<script src="js/store.js?v=4"></script>
<script src="js/timeline/clip.js?v=4"></script>
<script src="js/timeline/timeline.js?v=4"></script>

<script>
  const logs = document.getElementById('logs');
  function addLog(msg, pass, group) {
    if(group){ const h=document.createElement('h3'); h.textContent=group; logs.appendChild(h); }
    const div=document.createElement('div'); div.className='log '+(pass?'pass':'fail'); div.textContent=(pass?'✅ ':'❌ ')+msg; logs.appendChild(div);
  }

  try { const px=TimelineMath.timeToPixel(2,0); addLog(`math.js: timeToPixel = ${px}`, px===160, 'CORE'); } catch(e){ addLog('math.js FAILED', false, 'CORE'); }
  try { addLog(`snap-engine.js: loaded = ${typeof SnapEngine!=='undefined'}`, typeof SnapEngine!=='undefined', 'CORE'); } catch(e){ addLog('snap FAILED', false, 'CORE'); }
  try { const m=TransformEngine.getMatrix({rotation:90}); addLog(`transform.js: works = ${!!m}`, !!m, 'CORE'); } catch(e){ addLog('transform FAILED', false, 'CORE'); }
  try { addLog(`store.js: loaded = ${typeof Store!=='undefined'}`, typeof Store!=='undefined', 'CORE'); } catch(e){ addLog('store FAILED', false, 'CORE'); }

  try { const clip=new Clip({startTime:1, duration:2}); addLog(`clip.js: Clip created endTime=${clip.endTime} (expected 3)`, clip.endTime===3, 'TIMELINE'); } catch(e){ addLog('clip.js FAILED: '+e.message, false, 'TIMELINE'); }
  try { Timeline.addClip({startTime:0, duration:1}); addLog(`timeline.js: addClip works, total=${Timeline.clips.length}`, Timeline.clips.length>0, 'TIMELINE'); } catch(e){ addLog('timeline.js FAILED: '+e.message, false, 'TIMELINE'); }

  addLog('If all 6 ✅, Phase 2 Core Done! Next: gesture.js', true, 'FINAL');
</script>
</body>
</html>
