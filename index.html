<script>
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    if(window.TimelineUI && TimelineUI.init) TimelineUI.init('timelineArea');
    if(window.Selection){ /* init */ }
    if(window.Renderer && Renderer.init) Renderer.init();
    if(window.Player && Player.init) Player.init();
    if(window.Toolbar && Toolbar.init) Toolbar.init();
    if(window.TransformTool && TransformTool.init) TransformTool.init();
    if(window.TransformEngine && TransformEngine.init) TransformEngine.init();
    renderMainToolbar();
    if(window.EventBus){
      EventBus.on(EventBus.EVENTS.CLIP_SELECTED, (clip)=> {
        const c = clip.clip || clip;
        if(c && c.id){
          const realClip = TimelineUI.clips.find(x=>x.id===c.id) || c;
          showContextualToolbar(realClip);
          if(window.Renderer) Renderer.showClip(realClip);
        }
      });
      EventBus.on(EventBus.EVENTS.CLIP_DESELECTED, ()=> hideContextualToolbar());
    }
  },600);

  setTimeout(()=>{
    if(window.TransformTool && !window.TransformEngine) window.TransformEngine = window.TransformTool;
    if(window.TransformEngine && !window.TransformTool) window.TransformTool = window.TransformEngine;
    const need=['EventBus','TimelineMath','SnapEngine','IconSystem','Store','Toolbar','TransformEngine','Clip','TimelineUI','Renderer','Player','App'];
    const miss=need.filter(n=>typeof window[n]==='undefined');
    const badge=document.getElementById('badge');
    const info=document.getElementById('info');
    if(miss.length===0){
      badge.textContent='✅ v1.8.3 - Player Fixed - No Canvas Button!';
      badge.style.background='#4CAF50';
      info.textContent='✅ v1.8.3 Ready - Tap Media below to import';
      info.style.color='#4CAF50';
      const hint=document.getElementById('emptyHint');
      if(hint && TimelineUI.clips.length===0) hint.style.display='flex';
    } else {
      badge.textContent='❌ Missing: '+miss.join(',');
      badge.style.background='#FF3B30';
    }
  },2000);
});

function renderMainToolbar(){
  const bar=document.getElementById('mainToolbar');
  if(!bar||!window.IconSystem) return;
  const tools=[
    {id:'media', label:'Media', icon:'media', action:()=>{ if(window.MediaImportTool) MediaImportTool.importToTimeline(); }},
    {id:'text', label:'Text', icon:'text', action:()=> window.TextTool && TextTool.addTextClip()},
    {id:'audio', label:'Audio', icon:'music', action:()=> window.MediaImportTool && MediaImportTool.importToTimeline()},
    {id:'zoomOut', label:'Zoom-', icon:'zoomOut', size:20, action:()=> window.ZoomEngine && ZoomEngine.zoomOut()},
    {id:'zoomIn', label:'Zoom+', icon:'zoomIn', size:20, action:()=> window.ZoomEngine && ZoomEngine.zoomIn()},
    {id:'export', label:'Export', icon:'export', active:true, action:()=> console.log('Export')},
  ];
  bar.innerHTML=tools.map(t=>`<button class="tool-item ${t.active?'active':''}" id="btn-${t.id}">${IconSystem.render(t.icon,t.active,t.size||24)}<span>${t.label}</span></button>`).join('');
  tools.forEach(t=>{ document.getElementById(`btn-${t.id}`)?.addEventListener('click', t.action); });
}
function showContextualToolbar(clip){
  if(window.Toolbar && window.Toolbar.showForClip){ window.Toolbar.showForClip(clip); return; }
}
function hideContextualToolbar(){
  const bar=document.getElementById('contextualToolbar'); if(bar) bar.classList.remove('visible');
  if(window.Toolbar && window.Toolbar.hide) window.Toolbar.hide();
  if(window.Renderer) Renderer._hide();
}
</script>
