<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Video Editor - Core Test</title>
<style>
  body { background: #0E0E0E; color: white; font-family: sans-serif; padding: 20px; }
  .log { background: #1E1E1E; padding: 12px; margin: 10px 0; border-radius: 8px; font-family: monospace; }
  .pass { color: #4CAF50; border-left: 3px solid #4CAF50; }
  .fail { color: #FF3B30; border-left: 3px solid #FF3B30; }
</style>
</head>
<body>
<h2>Click Video Editor - Core Test V2</h2>
<div id="logs"></div>

<script>
// ===== js/core/math.js START =====
const TimelineMath = {
  config: { pixelsPerSecond: 80, minPPS: 10, maxPPS: 200, trackHeight: 70, snapThresholdPx: 15, screenWidth: 360 },
  timeToPixel(time, scrollOffset) { return (time - scrollOffset) * this.config.pixelsPerSecond; },
  pixelToTime(pixelX, scrollOffset) { return (pixelX / this.config.pixelsPerSecond) + scrollOffset; },
  durationToWidth(duration) { return duration * this.config.pixelsPerSecond; },
  getScrollOffsetForTime(currentTime) { return currentTime - (this.config.screenWidth / 2 / this.config.pixelsPerSecond); },
  TRACKS: { V1: 0, A1: 1, A2: 2, V2: 3, V3: 4, TEXT: 5, ADJUSTMENT: 6 }
};
window.TimelineMath = TimelineMath;
// ===== math.js END =====

// ===== snap-engine.js START =====
const SnapEngine = { config: { enabled: true } };
window.SnapEngine = SnapEngine;
// ===== snap-engine.js END =====

// ===== TESTS =====
const logs = document.getElementById('logs');
function addLog(msg, pass) {
  const div = document.createElement('div');
  div.className = 'log ' + (pass ? 'pass' : 'fail');
  div.textContent = (pass ? '✅ ' : '❌ ') + msg;
  logs.appendChild(div);
}
try {
  const px = TimelineMath.timeToPixel(2, 0);
  addLog(`timeToPixel(2,0) = ${px} (expected 160)`, px === 160);
} catch(e) { addLog('math.js error: ' + e.message, false); }
try {
  const t = TimelineMath.pixelToTime(160, 0);
  addLog(`pixelToTime(160,0) = ${t} (expected 2)`, t === 2);
} catch(e) { addLog('pixelToTime failed', false); }
try {
  addLog(`SnapEngine loaded = ${typeof SnapEngine !== 'undefined'}`, typeof SnapEngine !== 'undefined');
} catch(e) { addLog('snap-engine.js failed', false); }
addLog('If all 3 are ✅, then Phase 1 DONE!', true);
</script>
</body>
</html>
