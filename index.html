</style>

<script>
// ============================================================
// Click v3.0 GREEN - Clean Base Restore - All Inline - No Missing - No 404
// Base: Click v1.7 Real Import 36 Files - Order preserved, logic preserved
// Green #00C853 Primary, Dark #0E0E0E, Inactive #A0A0A0, SVG Only, No Emoji
// Architecture: 1 UI, 2 Timeline, 3 Selection, 4 Toolbar, 5 Rendering, 6 Export - Separated, Not Tightly Coupled
// ============================================================

// ---------- 1. EventBus ----------
const EventBus = { map:new Map(), on(e,h){ if(!this.map.has(e)) this.map.set(e,new Set()); this.map.get(e).add(h); return ()=>this.off(e,h); }, off(e,h){ const s=this.map.get(e); if(s) s.delete(h); }, emit(e,p){ const s=this.map.get(e); if(!s) return; [...s].forEach(h=>{ try{h(p)}catch(err){ console.error('[EventBus]',e,err) } }); } };
EventBus.EVENTS = { TIMELINE_ZOOM:'timeline:zoom', SELECTION_CHANGE:'selection:change', TOOLBAR_ACTION:'toolbar:action', RENDER_REQUEST:'render:request', EXPORT_START:'export:start', STORE_PATCH:'store:patch' };
window.EventBus = EventBus;

// ---------- 2. TimelineMath - Single Source - Pinch Chain Root ----------
const TimelineMath = {
  config:{ pixelsPerSecond:80, minPps:5, maxPps:300, screenWidth:360 },
  timeToPixel(time, scroll){ return (time - (scroll||0)) * this.config.pixelsPerSecond; },
  pixelToTime(px, scroll){ return (px / this.config.pixelsPerSecond) + (scroll||0); },
  setPps(pps){
    const clamped = Math.max(this.config.minPps, Math.min(this.config.maxPps, pps));
    this.config.pixelsPerSecond = clamped;
    if(window.ZoomEngine && ZoomEngine.currentPps!==clamped) ZoomEngine.currentPps = clamped;
    if(window.TimelineUI && TimelineUI.pixelsPerSecond!==clamped) TimelineUI.pixelsPerSecond = clamped;
    if(window.Transport && Transport.pps!==clamped) Transport.pps = clamped;
    EventBus.emit(EventBus.EVENTS.TIMELINE_ZOOM, {pps:clamped});
    return clamped;
  },
  getPps(){ return this.config.pixelsPerSecond; },
  getScrollForTime(t, w){ return t - (w/2/this.config.pixelsPerSecond); },
  TRACKS:{ V1:0, V2:1, TEXT:2, A1:3 }
};
window.TimelineMath = TimelineMath;

// ---------- 3. Store ----------
const Store = {
  currentProject:{ clips:[], duration:0, name:'Click Project' },
  history:[], future:[],
  pushHistory(){ this.history.push(JSON.stringify(this.currentProject.clips)); if(this.history.length>50) this.history.shift(); this.future=[]; },
  undo(){ if(!this.history.length) return; this.future.push(JSON.stringify(this.currentProject.clips)); this.currentProject.clips = JSON.parse(this.history.pop()); if(window.TimelineUI) TimelineUI.render(); },
  redo(){ if(!this.future.length) return; this.history.push(JSON.stringify(this.currentProject.clips)); this.currentProject.clips = JSON.parse(this.future.pop()); if(window.TimelineUI) TimelineUI.render(); }
};
window.Store = Store;
window.App = { currentProject: Store.currentProject };

// ---------- 4. Clip ----------
class Clip {
  constructor(data){
    this.id = data.id || 'clip_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    this.track = data.track || 'V1';
    this.startTime = data.startTime || 0;
    this.duration = data.duration || 2;
    this.sourceOffset = data.sourceOffset || 0;
    this.type = data.type || 'video';
    this.src = data.src || '';
    this.name = data.name || 'Clip';
    this.effects = data.effects || {};
    this.transform = data.transform || {x:0,y:0,scaleX:1,scaleY:1,rotation:0};
    this.zIndex = data.zIndex || 0;
    this.opacity = data.opacity ?? 1;
    this.blendMode = data.blendMode || 'normal';
    this.keyframes = data.keyframes || [];
  }
  get endTime(){ return this.startTime + this.duration; }
}
window.Clip = Clip;

// ---------- 5. Timeline ----------
const Timeline = {
  clips:[],
  init(){ console.log('Timeline Ready - Tracks: V1,V2,Text,A1'); },
  addClip(d){ const c=new Clip(d); this.clips.push(c); return c; }
};
window.Timeline = Timeline; Timeline.init();

// ---------- 6. ZoomEngine - 5 to 300px/s - Visual Zoom Fix ----------
const ZoomEngine = {
  minPps:5, maxPps:300, defaultPps:80, currentPps:80,
  init(){ this.currentPps=80; if(window.TimelineUI) TimelineUI.pixelsPerSecond=this.currentPps; console.log('ZoomEngine v3.0 GREEN - 5 to 300px/s - Clean Base'); },
  zoomBy(scale){ this.setZoom(this.currentPps * scale); },
  setZoom(pps){
    pps = Math.max(this.minPps, Math.min(this.maxPps, pps));
    if(Math.abs(pps - this.currentPps) < 0.2) return pps;
    this.currentPps = pps;
    TimelineMath.config.pixelsPerSecond = pps;
    if(window.TimelineUI){ TimelineUI.pixelsPerSecond = pps; TimelineUI.render(); }
    if(window.Transport){ Transport.pps = pps; if(Transport.renderRuler) Transport.renderRuler(); }
    EventBus.emit(EventBus.EVENTS.TIMELINE_ZOOM, {pps:pps, zoomLevel:this.getZoomLevel()});
    this.updateUI();
    const st=document.getElementById('status');
    if(st) st.textContent='Zoom: '+Math.round(pps)+'px/s - Pinch OK! - '+Math.round((pps/80)*100)+'%';
    setTimeout(()=>{ const s2=document.getElementById('status'); if(s2 && s2.textContent.includes('Pinch OK')) s2.textContent='Ready - Timeline scrolls left when playing - Fixed Center - Pinch 5 to 300px/s - Green #00C853'; }, 1500);
    console.log('ZoomEngine v3.0 - Visual Zoom - pps', Math.round(pps));
    return pps;
  },
  zoomIn(){ this.setZoom(this.currentPps*1.3); },
  zoomOut(){ this.setZoom(this.currentPps*0.7); },
  zoomToFit(duration){
    if(!duration || !window.TimelineUI) return;
    const w = document.getElementById('timelineArea')?.clientWidth || 360;
    const target = (w*0.7)/duration;
    this.setZoom(target);
  },
  getZoomLevel(){ return (this.currentPps/this.defaultPps)*100; },
  getPps(){ return this.currentPps; },
  updateUI(){ const z=document.getElementById('zoomLabel'); if(z) z.textContent=Math.round(this.getZoomLevel())+'% - '+Math.round(this.currentPps)+'px/s'; },
  handlePinch(startDist, curDist){ const s=curDist/startDist; this.zoomBy(s); }
};
window.ZoomEngine = ZoomEngine;

// ---------- 7. TimelineUI - Thin Layers + Canvas Ruler + Pinch + Fixed Center ----------
const TimelineUI = {
  container:null, canvas:null, ctx:null,
  pixelsPerSecond:80, scrollOffset:-2, clips:[], selectedClip:null,
  tracks:['V1','V2','Text','A1'],
  init(containerId='timelineArea'){
    this.container=document.getElementById(containerId);
    if(!this.container) return;
    this.bindPinchEvents();
    this.render();
    console.log('TimelineUI v3.0 GREEN - Thin Layers - V1 52px V2 36px Text 30px A1 40px - Pinch - Fixed Center');
  },
  timeToPixel(t){ return (t - this.scrollOffset) * this.pixelsPerSecond; },
  pixelToTime(px){ return (px / this.pixelsPerSecond) + this.scrollOffset; },
  formatTime(s){
    if(s<0) s=0;
    const m=Math.floor(s/60), sec=Math.floor(s%60), ms=Math.floor((s%1)*100);
    const mm=String(m).padStart(2,'0'), ss=String(sec).padStart(2,'0');
    if(this.pixelsPerSecond>150) return mm+':'+ss+'^'+String(ms).padStart(2,'0');
    return mm+':'+ss;
  },
  addClip(clip){
    if(this.clips.length===0){
      const w=document.getElementById('timelineArea')?.clientWidth||360;
      this.scrollOffset = -((w/2)/this.pixelsPerSecond) + 0.15;
    }
    this.clips.push(clip);
    Store.currentProject.clips = this.clips;
    Timeline.clips = this.clips;
    this.render();
  },
  clearAll(){ this.clips=[]; this.selectedClip=null; this.render(); },
  render(){
    // Render Div Clips - Thin Layers
    const inner=document.getElementById('timelineInner');
    if(!inner) return;
    const maxTime = this.clips.length ? Math.max(...this.clips.map(c=>c.endTime)) : 10;
    const totalWidth = Math.max(maxTime * this.pixelsPerSecond + 500, (document.getElementById('timelineArea')?.clientWidth||360)*2.5);
    inner.style.minWidth = totalWidth+'px';
    document.querySelectorAll('.trackContent').forEach(el=>{ el.style.minWidth = totalWidth+'px'; });
    // Clear existing clip divs
    document.querySelectorAll('.clip').forEach(el=>el.remove());
    const empty=document.getElementById('emptyHint');
    if(empty) empty.style.display = this.clips.length ? 'none' : 'block';
    this.clips.forEach(clip=>{
      const content=document.querySelector('.trackContent[data-track="'+clip.track+'"]');
      if(!content) return;
      const div=document.createElement('div');
      div.className='clip '+ (clip.type==='video'?'video':clip.type==='image'?'image':clip.type==='text'?'textclip':'audio') + (this.selectedClip && this.selectedClip.id===clip.id ? ' selected':'');
      div.dataset.id=clip.id;
      const left = clip.startTime * this.pixelsPerSecond;
      const width = Math.max(clip.duration * this.pixelsPerSecond, 40);
      div.style.left = left+'px';
      div.style.width = width+'px';
      // Waveform for audio - Green bars
      let waveHtml='';
      if(clip.type==='audio'){
        let bars='';
        for(let i=0;i<28;i++){ const h=4+Math.floor(Math.abs(Math.sin(i*0.7+clip.startTime)*16)); bars+='<i style="height:'+h+'px"></i>'; }
        waveHtml='<div class="waveform">'+bars+'</div>';
      }
      div.innerHTML = '<span class="handle left"></span><span class="clipName">'+clip.name+'</span>'+waveHtml+'<span class="handle right"></span>';
      div.addEventListener('click', (e)=>{ e.stopPropagation(); if(window.Selection) Selection.selectClip(clip); });
      // Drag - LongPress 300ms already in Gesture, here simple drag for mouse
      let isDown=false, startX=0, startT=0;
      div.addEventListener('mousedown', (e)=>{ isDown=true; startX=e.clientX; startT=clip.startTime; });
      document.addEventListener('mousemove', (e)=>{ if(!isDown) return; const dx=e.clientX-startX; clip.startTime=Math.max(0, startT + dx/this.pixelsPerSecond); this.render(); });
      document.addEventListener('mouseup', ()=>{ if(isDown){ isDown=false; if(window.Transport) Transport.syncPlayhead(); } });
      content.appendChild(div);
    });
    // Update total time
    const total=document.getElementById('totalTime');
    if(total) total.textContent=this.formatTime(maxTime);
    if(window.Transport) Transport.renderRuler();
  },
  setZoom(pps){ this.pixelsPerSecond=pps; this.render(); },
  bindPinchEvents(){
    const el=document.getElementById('timelineArea');
    if(!el || el._pinchBoundV3) return;
    let startDist=0, startPps=80, lastScale=1, isPinching=false;
    el.addEventListener('touchstart', (e)=>{
      if(e.touches.length===2){
        isPinching=true;
        const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        startDist=Math.sqrt(dx*dx+dy*dy); startPps=ZoomEngine.currentPps; lastScale=1;
        console.log('PINCH START (TimelineUI v3.0) dist', Math.round(startDist), 'pps', startPps);
        e.preventDefault();
      }
    }, {passive:false});
    el.addEventListener('touchmove', (e)=>{
      if(e.touches.length===2 && isPinching){
        const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        const curDist=Math.sqrt(dx*dx+dy*dy);
        const scale=curDist/startDist;
        if(Math.abs(scale-lastScale)<0.01){ e.preventDefault(); return; }
        lastScale=scale;
        console.log('PINCH MOVE (TimelineUI v3.0) scale', scale.toFixed(3), 'newPps', Math.round(startPps*scale));
        ZoomEngine.handlePinch(startDist, curDist);
        e.preventDefault();
      }
    }, {passive:false});
    el.addEventListener('touchend', (e)=>{ if(e.touches.length<2){ if(isPinching) console.log('PINCH END (TimelineUI v3.0) pps', ZoomEngine.currentPps); isPinching=false; startDist=0; } });
    // Also bind ruler
    const ruler=document.getElementById('rulerCanvas');
    if(ruler && !ruler._pinchBoundV3){
      ruler.addEventListener('touchstart', (e)=>{ if(e.touches.length===2){ isPinching=true; const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; startDist=Math.sqrt(dx*dx+dy*dy); startPps=ZoomEngine.currentPps; lastScale=1; e.preventDefault(); } }, {passive:false});
      ruler.addEventListener('touchmove', (e)=>{ if(e.touches.length===2 && isPinching){ const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; const curDist=Math.sqrt(dx*dx+dy*dy); const scale=curDist/startDist; if(Math.abs(scale-lastScale)<0.01) return; lastScale=scale; ZoomEngine.handlePinch(startDist, curDist); e.preventDefault(); } }, {passive:false});
      ruler.addEventListener('touchend', (e)=>{ if(e.touches.length<2) isPinching=false; });
      ruler._pinchBoundV3=true;
    }
    el._pinchBoundV3=true;
    console.log('TimelineUI pinch bound - v3.0 GREEN - Clean Base');
  }
};

// ---------- 8. Gesture - Pinch + LongPress 300ms ----------
const Gesture = {
  isDragging:false, isPinching:false, startX:0, startTime:0, startDist:0, startPps:80, lastScale:1, longPressTimer:null,
  onTouchStart(e, clip){
    if(e.touches && e.touches.length===2){
      this.isPinching=true;
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      this.startDist=Math.sqrt(dx*dx+dy*dy); this.startPps=ZoomEngine.currentPps; this.lastScale=1;
      console.log('PINCH START (Gesture v3.0) dist', Math.round(this.startDist), 'pps', this.startPps);
      clearTimeout(this.longPressTimer);
      if(e.cancelable) e.preventDefault();
      return;
    }
    if(!clip) return;
    this.startX=e.touches[0].clientX; this.startTime=clip.startTime; this.isDragging=false;
    this.longPressTimer=setTimeout(()=>{ this.isDragging=true; console.log('LongPress: Start Drag', clip.id); if(navigator.vibrate) navigator.vibrate(50); }, 300);
  },
  onTouchMove(e, clip){
    if(e.touches && e.touches.length===2 && this.isPinching){
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      const curDist=Math.sqrt(dx*dx+dy*dy); const scale=curDist/this.startDist;
      if(Math.abs(scale-this.lastScale)<0.01) return;
      this.lastScale=scale;
      console.log('PINCH MOVE (Gesture v3.0) scale', scale.toFixed(3), 'newPps', Math.round(this.startPps*scale));
      ZoomEngine.handlePinch(this.startDist, curDist);
      if(e.cancelable) e.preventDefault();
      return;
    }
    if(!this.isDragging || !clip) return;
    const dx=e.touches[0].clientX-this.startX;
    clip.startTime=Math.max(0, this.startTime + dx/TimelineMath.config.pixelsPerSecond);
    if(window.TimelineUI) TimelineUI.render();
  },
  onTouchEnd(){ clearTimeout(this.longPressTimer); this.isDragging=false; this.isPinching=false; this.startDist=0; },
  init(){
    console.log('Gesture v3.0 - Document Backup Pinch + LongPress Drag - Ready');
    const els=[document.getElementById('timelineArea'), document.getElementById('rulerCanvas'), document.body, document];
    els.forEach(el=>{ if(!el || el._pinchBackupV3) return; el.addEventListener('touchstart', (e)=>this.onTouchStart(e, null), {passive:false}); el.addEventListener('touchmove', (e)=>this.onTouchMove(e, null), {passive:false}); el.addEventListener('touchend', ()=>this.onTouchEnd(), {passive:false}); el._pinchBackupV3=true; });
  }
};

// ---------- 10. Transport - Roller + Playhead Fixed Center ----------
const Transport = {
  pps:80, currentTime:0, isPlaying:false, duration:0,
  renderRuler(){
    const canvas=document.getElementById('rulerCanvas');
    if(!canvas) return;
    const wrap=document.getElementById('rulerWrap');
    const w=wrap?.clientWidth||360;
    const dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr; canvas.height=28*dpr;
    canvas.style.width=w+'px'; canvas.style.height='28px';
    const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#1E1E1E'; ctx.fillRect(0,0,w,28);
    // Ruler logic - Base from timeline-ui v2.0 - majorStep/minorStep based on pps
    const pps=this.pps;
    let majorStep=2, minorStep=0.5, labelStep=2;
    if(pps<20){ majorStep=10; minorStep=2; labelStep=10; }
    else if(pps<50){ majorStep=5; minorStep=1; labelStep=5; }
    else if(pps<120){ majorStep=2; minorStep=0.5; labelStep=2; }
    else if(pps<200){ majorStep=1; minorStep=0.25; labelStep=1; }
    else { majorStep=0.5; minorStep=0.1; labelStep=0.5; }
    // ScrollOffset from TimelineUI - CapCut Fixed Center
    const scroll = window.TimelineUI ? TimelineUI.scrollOffset : 0;
    const startTime = Math.max(0, scroll);
    const endTime = scroll + w/pps + 1;
    ctx.strokeStyle='#3A3A3A'; ctx.fillStyle='#A0A0A0'; ctx.font='9px Inter,sans-serif'; ctx.textAlign='left';
    for(let t=Math.floor(startTime/minorStep)*minorStep; t<=endTime; t+=minorStep){
      const x=(t-scroll)*pps;
      if(x<0||x>w) continue;
      const isMajor = Math.abs(t/majorStep - Math.round(t/majorStep))<0.01;
      const isLabel = Math.abs(t/labelStep - Math.round(t/labelStep))<0.01;
      if(isMajor){ ctx.beginPath(); ctx.moveTo(x,14); ctx.lineTo(x,28); ctx.stroke(); }
      else { ctx.beginPath(); ctx.moveTo(x,20); ctx.lineTo(x,28); ctx.stroke(); }
      if(isLabel){
        const mins=Math.floor(t/60), secs=Math.floor(t%60);
        const label=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
        ctx.fillText(label, x+3, 11);
        // Dots system - small dots between labels
        ctx.fillStyle='#00C853'; ctx.beginPath(); ctx.arc(x, 5, 1.5, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='#A0A0A0';
      }
    }
    // Total duration label on right
    if(this.duration>0){
      ctx.fillStyle='#fff'; ctx.textAlign='right';
      const totalM=Math.floor(this.duration/60), totalS=Math.floor(this.duration%60);
      ctx.fillText(String(totalM).padStart(2,'0')+':'+String(totalS).padStart(2,'0'), w-6, 11);
      ctx.textAlign='left';
    }
  },
  syncPlayhead(){
    // CapCut Fixed Center: Playhead fixed center, Timeline scrolls left
    const area=document.getElementById('timelineArea');
    if(!area) return;
    const pps=this.pps;
    const containerW=area.clientWidth||360;
    const centerX=containerW/2;
    const targetScrollLeft = this.currentTime * pps - centerX + 44;
    if(this.isPlaying || Math.abs(area.scrollLeft - targetScrollLeft)>2){
      area.scrollLeft = Math.max(0, targetScrollLeft);
    }
    // Update time label
    const cur=document.getElementById('curTime');
    if(cur){
      const m=Math.floor(this.currentTime/60), s=Math.floor(this.currentTime%60);
      cur.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }
    // Playhead line stays at 50% center - already CSS left:50%
  },
  seekTo(t){ this.currentTime=Math.max(0,t); if(window.MarkersEngine) MarkersEngine.setPlayheadTime(t); }
};
window.Transport = Transport;

// ---------- 15. MediaImportTool - Permission Once - No Doubling ----------
const MediaImportTool = {
  permissionAsked: localStorage.getItem('click_media_perm')==='asked',
  async importToTimeline(){
    // Permission Once - Ask only once, not every time app opens
    if(!this.permissionAsked){
      // In browser, file picker itself is permission - we mark asked after first picker
      this.permissionAsked=true;
      localStorage.setItem('click_media_perm','asked');
    }
    const input=document.createElement('input');
    input.type='file'; input.accept='video/*,image/*,audio/*'; input.multiple=false;
    const clips = await new Promise((resolve)=>{
      input.onchange=()=>{ resolve(input.files); };
      input.oncancel=()=>resolve(null);
      input.click();
    });
    if(!clips || !clips.length) return [];
    const file=clips[0];
    const url=URL.createObjectURL(file);
    const isVideo=file.type.startsWith('video');
    const isImage=file.type.startsWith('image');
    const isAudio=file.type.startsWith('audio');
    let duration=5;
    if(isVideo || isAudio){
      const media=document.createElement(isVideo?'video':'audio');
      media.src=url;
      await new Promise(res=>{ media.onloadedmetadata=()=>{ duration=media.duration||5; res(); }; setTimeout(res, 1000); });
    }
    const start = TimelineUI.clips.length ? Math.max(...TimelineUI.clips.map(c=>c.endTime)) : 0;
    const clip=new Clip({ track: isAudio?'A1':'V1', type: isVideo?'video':isImage?'image':'audio', src:url, name:file.name, startTime:start, duration:duration, sourceOffset:0 });
    TimelineUI.addClip(clip);
    // Hide Import Button - No Doubling - Show Video
    const importBtn=document.getElementById('importBtn');
    if(importBtn) importBtn.classList.add('hidden');
    const video=document.getElementById('realVideo');
    if(video && isVideo){ video.src=url; video.style.display='block'; video.currentTime=0; }
    else if(video && isImage){ video.style.display='none'; }
    const status=document.getElementById('status');
    if(status) status.textContent='Imported '+file.name+' - Tap Play to Play - No Autoplay';
    Transport.duration = Math.max(Transport.duration, clip.endTime);
    // Select clip - Show Contextual Toolbar
    if(window.Selection) Selection.selectClip(clip);
    console.log('MediaImport v3.0 GREEN - Imported', file.name, 'duration', duration);
    return [clip];
  },
  async importPiP(){
    if(!TimelineUI.clips.length){ alert('First import main video, then PiP / Overlay'); return []; }
    return this.importToTimeline();
  }
};
window.MediaImportTool = MediaImportTool;

// ---------- 16. TrimSplitTool ----------
const TrimSplitTool = {
  splitAtPlayhead(){
    const sel=Selection.getSelected();
    if(!sel) return;
    const t=Transport.currentTime;
    if(t<=sel.startTime || t>=sel.endTime) return;
    const newClip=new Clip({...sel, id:'clip_'+Date.now(), startTime:t, duration:sel.endTime-t});
    sel.duration=t-sel.startTime;
    TimelineUI.addClip(newClip);
    console.log('Split at', t);
  }
};
window.TrimSplitTool = TrimSplitTool;

// ---------- 17. TextTool ----------
const TextTool = {
  addTextClip(){
    const start=Transport.currentTime;
    const clip=new Clip({ track:'Text', type:'text', name:'Text', startTime:start, duration:3, src:'' });
    TimelineUI.addClip(clip);
    if(window.Selection) Selection.selectClip(clip);
    console.log('TextTool v3.0 - Added Text Clip');
  }
};
window.TextTool = TextTool;

// ---------- 18. AudioTool ----------
const AudioTool = {
  async importAudio(){
    // Audio gallery with permission Once
    return MediaImportTool.importToTimeline();
  }
};
window.AudioTool = AudioTool;

// ---------- 19. ExportEngine ----------
const ExportEngine = {
  export(){ alert('Export - Coming in Phase 4 - Video will export with Timeline'); }
};
window.ExportEngine = ExportEngine;

// ---------- Init - Clean Base ----------
setTimeout(()=>{
  if(window.TimelineUI) TimelineUI.init('timelineArea');
  if(window.ZoomEngine) ZoomEngine.init();
  if(window.Player) Player.init();
  if(window.Gesture) Gesture.init();
  if(window.Selection) Selection.init();
  if(window.Transport) Transport.renderRuler();
  // Badge - No Missing Check
  const all=['TimelineMath','Store','Clip','Timeline','Gesture','Selection','TimelineUI','ZoomEngine','MarkersEngine','Player','Renderer','Toolbar','MediaImportTool','Transport','EventBus'];
  const missing=all.filter(n=>typeof window[n]==='undefined');
  const badge=document.getElementById('badge');
  if(missing.length===0){ badge.textContent='All 15 Core - Clean Base Ready - Green #00C853'; badge.classList.remove('missing'); badge.style.background='#00C853'; }
  else { badge.textContent='Missing: '+missing.join(','); badge.classList.add('missing'); }
  const status=document.getElementById('status');
  if(status) status.textContent='Ready - Green #00C853 - Thin Layers - Pinch 5 to 300px/s - No Missing - No Doubling';
}, 400);

// ---------- Wiring - Buttons - SVG Only - No Emoji ----------
document.getElementById('importBtn')?.addEventListener('click', async ()=>{
  const status=document.getElementById('status');
  if(status) status.textContent='Opening Gallery...';
  if(window.MediaImportTool){
    const clips=await MediaImportTool.importToTimeline();
    if(!clips || !clips.length){ if(status) status.textContent='No file selected'; }
  }
});
document.getElementById('btnMedia')?.addEventListener('click', ()=> MediaImportTool.importToTimeline());
document.getElementById('btnAudio')?.addEventListener('click', ()=> MediaImportTool.importToTimeline());
document.getElementById('btnText')?.addEventListener('click', ()=> TextTool.addTextClip());
document.getElementById('btnPiP')?.addEventListener('click', ()=> MediaImportTool.importPiP());
document.getElementById('btnZoomOut')?.addEventListener('click', ()=> ZoomEngine.zoomOut());
document.getElementById('btnZoomIn')?.addEventListener('click', ()=> ZoomEngine.zoomIn());
document.getElementById('btnExport')?.addEventListener('click', ()=> ExportEngine.export());
document.getElementById('exportBtnTop')?.addEventListener('click', ()=> ExportEngine.export());
document.getElementById('btnPlayPause')?.addEventListener('click', ()=> Player.togglePlay());
document.getElementById('playOverlay')?.addEventListener('click', ()=> Player.togglePlay());
document.getElementById('realVideo')?.addEventListener('click', ()=> Player.togglePlay());
document.getElementById('btnUndo')?.addEventListener('click', ()=> Store.undo());
document.getElementById('btnRedo')?.addEventListener('click', ()=> Store.redo());
document.getElementById('btnJumpStart')?.addEventListener('click', ()=>{ Transport.seekTo(0); });
document.getElementById('btnJumpEnd')?.addEventListener('click', ()=>{ Transport.seekTo(Transport.duration||10); });
document.getElementById('btnFrameBack')?.addEventListener('click', ()=>{ Transport.seekTo(Math.max(0, Transport.currentTime - (1/30))); });
document.getElementById('btnFrameFwd')?.addEventListener('click', ()=>{ Transport.seekTo(Transport.currentTime + (1/30)); });
document.getElementById('btnJumpStart')?.addEventListener('click', ()=>{ Transport.seekTo(0); });
// Timeline area click deselect
document.getElementById('timelineArea')?.addEventListener('click', (e)=>{ if(e.target.id==='timelineArea' || e.target.classList.contains('trackContent')) Selection.deselect(); });
// Ruler click seek
document.getElementById('rulerCanvas')?.addEventListener('click', (e)=>{
  const rect=e.target.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const scroll=TimelineUI.scrollOffset||0;
  const t=scroll + x/TimelineUI.pixelsPerSecond;
  Transport.seekTo(Math.max(0,t));
});

console.log('Click v3.0 GREEN - Clean Base Restore - No Missing - No Doubling - Pinch Full Chain - CapCut Fixed Center - Thin Layers - SVG Only - Ready');
