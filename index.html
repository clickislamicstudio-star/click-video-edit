<script>
// === EventBus INLINE - Phase 0 ===
window.EventBus = {
  _events: new Map(),
  on(event, cb){ if(!this._events.has(event)) this._events.set(event,[]); this._events.get(event).push(cb); return ()=>this.off(event,cb); },
  off(event, cb){ if(!this._events.has(event)) return; this._events.set(event, this._events.get(event).filter(x=>x!==cb)); },
  emit(event, payload){ if(!this._events.has(event)) return; this._events.get(event).forEach(cb=>{try{cb(payload)}catch(e){}}); },
  EVENTS: { CLIP_SELECTED:'clip:selected', CLIP_DESELECTED:'clip:deselected', TIMELINE_ZOOM:'timeline:zoom', TOOLBAR_CHANGE:'toolbar:change', PROJECT_SAVED:'project:saved' }
};

// === TimelineMath SINGLE SOURCE ===
window.TimelineMath = {
  config: { pixelsPerSecond:80, minPps:5, maxPps:300, screenWidth:360, trackHeight:45 },
  timeToPixel(t,s){ return (t-s)*this.config.pixelsPerSecond; },
  pixelToTime(p,s){ return (p/this.config.pixelsPerSecond)+s; },
  durationToPixel(d){ return d*this.config.pixelsPerSecond; },
  setPps(pps){ const c=Math.max(this.config.minPps, Math.min(this.config.maxPps, pps)); this.config.pixelsPerSecond=c; EventBus.emit(EventBus.EVENTS.TIMELINE_ZOOM,{pps:c}); return c; },
  getPps(){ return this.config.pixelsPerSecond; },
  getScrollForTime(ct,w){ return ct-(w/2/this.config.pixelsPerSecond); },
  TRACKS: { V1:{id:0,name:'V1',type:'video'}, V2:{id:1,name:'V2',type:'video'}, TEXT:{id:3,name:'Text',type:'text'}, A1:{id:5,name:'A1',type:'audio'} }
};

// === SnapEngine REAL ===
window.SnapEngine = {
  config:{enabled:true, thresholdPx:15, snapToPlayhead:true, snapToClips:true},
  check(cur, all, head){
    if(!this.config.enabled) return null;
    const thr=this.config.thresholdPx/TimelineMath.getPps();
    let best=null, min=thr;
    const cs=cur.startTime, ce=cur.startTime+cur.duration;
    if(this.config.snapToClips){
      for(const c of all){ if(c.id===cur.id) continue; for(const e of [c.startTime, c.startTime+c.duration]){ const ds=Math.abs(cs-e); if(ds<min){min=ds; best={snapTime:e, type:'clip-edge'}}; const de=Math.abs(ce-e); if(de<min){min=de; best={snapTime:e-cur.duration, type:'clip-edge'}}; } }
    }
    if(this.config.snapToPlayhead){ const d1=Math.abs(cs-head); if(d1<min){min=d1; best={snapTime:head, type:'playhead'}}; const d2=Math.abs(ce-head); if(d2<min){min=d2; best={snapTime:head-cur.duration, type:'playhead'}}; }
    return best;
  }
};

// === IconSystem M3 ===
window.IconSystem = {
  config:{active:'#FF3B30', inactive:'#A0A0A0'},
  icons:{
    trim:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 3v18M3 7.5h4M3 16.5h4M17 8l4-4v16l-4-4h-3V8h3z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    split:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M16 3v18M8 7c0-1 1-2 2-2h2M8 17c0 1 1 2 2 2h2M3 12h6M15 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    crop:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 3v3M3 6h3M18 18v3M15 21h3M7 11a5 5 0 0 0 5 5M7 16V11h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    speed:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" stroke="currentColor" stroke-width="1.8"/></svg>`,
    volume:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5zM15 8a4 4 0 0 1 0 8M19 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    filter:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="6" r="2" fill="currentColor"/></svg>`,
    delete:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M10 11v6M14 11v6M5 6l1 14h12l1-14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    font:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M12 6v12M8 18h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    color:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>`,
    animation:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    music:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8"/></svg>`,
    media:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 5h12a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2V5z" stroke="currentColor" stroke-width="1.8"/><path d="M16 5l4 4v4" stroke="currentColor" stroke-width="1.8"/></svg>`,
    text:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M8 7v10M16 7v10M8 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    export:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3v13M8 11l4-4 4 4M3 21h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    zoomIn:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    zoomOut:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M8 11h6M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
  },
  render(name, active=false, size=24){ const svg=this.icons[name]||this.icons.media; const color=active?this.config.active:this.config.inactive; return `<span style="color:${color};width:${size}px;height:${size}px;display:inline-flex">${svg}</span>`; },
  getRegistry(){ return { video:['trim','split','crop','speed','volume','filter','delete'], text:['font','color','animation','delete'], audio:['volume','speed','music','delete'], image:['crop','filter','animation','delete'], main:['media','text','music','export'] }; }
};

// === AndroidBridge ===
window.AndroidBridge = {
  isAndroid: !!window.Android,
  pickMedia(){ if(this.isAndroid) window.Android.pickMedia(); else { const i=document.createElement('input'); i.type='file'; i.accept='video/*'; i.onchange=e=>{ const f=e.target.files[0]; if(f) { const url=URL.createObjectURL(f); window.dispatchEvent(new CustomEvent('android-media',{detail:{url,name:f.name}})); if(window.MediaImportTool) MediaImportTool.importToTimeline(); } }; i.click(); } },
  vibrate(ms=50){ if(navigator.vibrate) navigator.vibrate(ms); }
};

// === Store FIXED ===
window.Store = {
  dbName:'ClickVideoEditorDB_v2', db:null,
  _state:{ project:null, playback:{currentTime:0,isPlaying:false,scrollOffset:-2}, selection:{selectedClipId:null}, ui:{pps:80, toolbarMode:'main'}, history:{stack:[], pointer:-1} },
  async init(){ return new Promise(res=>{ const req=indexedDB.open(this.dbName,2); req.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'}); if(!db.objectStoreNames.contains('autosave')) db.createObjectStore('autosave',{keyPath:'id'}); }; req.onsuccess=e=>{ this.db=e.target.result; if(window.App&&App.currentProject) this._state.project=App.currentProject; this.startAutoSave(); res(); }; req.onerror=()=>res(); }); },
  dispatch(action){ if(['ADD_CLIP','MOVE_CLIP'].includes(action.type)){ this._state.history.stack=this._state.history.stack.slice(0,this._state.history.pointer+1); this._state.history.stack.push(JSON.parse(JSON.stringify(this._state))); this._state.history.pointer++; } if(action.type==='SELECT_CLIP'){ this._state.selection.selectedClipId=action.payload.id; this._state.ui.toolbarMode=action.payload.clipType||'video'; EventBus.emit(EventBus.EVENTS.CLIP_SELECTED, action.payload); } if(action.type==='DESELECT'){ this._state.selection.selectedClipId=null; this._state.ui.toolbarMode='main'; EventBus.emit(EventBus.EVENTS.CLIP_DESELECTED,{}); } },
  getState(){return this._state;},
  startAutoSave(){ setInterval(()=>{ const p=window.App?.currentProject||this._state.project; if(!p||!this.db) return; try{ const tx=this.db.transaction('autosave','readwrite'); tx.objectStore('autosave').put({id:'last', data:p, ts:Date.now()}); }catch(e){} },10000); }
};

// === Toolbar FIXED ===
window.Toolbar = {
  currentClip:null,
  showForClip(clip){ this.currentClip=clip; if(window.Store) Store.dispatch({type:'SELECT_CLIP', payload:{id:clip.id||clip.name, track:clip.track, clipType:clip.type||'video', name:clip.name}}); if(window.EventBus) EventBus.emit(EventBus.EVENTS.CLIP_SELECTED, clip); console.log('Toolbar show for', clip.type||clip.name); },
  hide(){ this.currentClip=null; if(window.Store) Store.dispatch({type:'DESELECT'}); }
};

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    if(window.TimelineUI){ TimelineUI.pixelsPerSecond = TimelineMath.getPps(); TimelineUI.init('timelineArea'); }
    if(window.ZoomEngine) ZoomEngine.init();
    if(window.Player) Player.init();
    if(window.Store) Store.init();
    renderMainToolbar();
    
    if(window.EventBus){
      EventBus.on(EventBus.EVENTS.CLIP_SELECTED, (clip)=> showContextualToolbar(clip));
      EventBus.on(EventBus.EVENTS.CLIP_DESELECTED, ()=> hideContextualToolbar());
      EventBus.on(EventBus.EVENTS.TIMELINE_ZOOM, (data)=>{ if(window.TimelineUI){ TimelineUI.pixelsPerSecond=data.pps; TimelineUI.render(); }});
    }
  },700);

  document.getElementById('importBtn')?.addEventListener('click', async ()=>{
    const s=document.getElementById('status'); if(s) s.textContent='Opening...';
    if(window.AndroidBridge) AndroidBridge.pickMedia();
    const clips = window.MediaImportTool ? await MediaImportTool.importToTimeline() : [];
    if(clips && clips.length>0){ if(s) s.textContent='Imported '+clips.length; document.getElementById('importBtn').style.display='none'; document.getElementById('realVideo').style.display='block'; if(navigator.vibrate) navigator.vibrate(50); }
  });

  setTimeout(()=>{
    const need=['EventBus','TimelineMath','SnapEngine','IconSystem','AndroidBridge','Store','Toolbar','TransformEngine','KeyframeEngine','I18n','Clip','TimelineUI','Player','App'];
    const miss=need.filter(n=>typeof window[n]==='undefined');
    const badge=document.getElementById('badge');
    const info=document.getElementById('info');
    if(miss.length===0){
      badge.textContent='✅ v1.8.1 Hotfix - All Core Ready - Android Ready!';
      badge.style.background='#4CAF50';
      info.textContent='✅ Phase 0 Hotfix Complete - Moving to Phase 1';
      info.style.color='#4CAF50';
    } else {
      badge.textContent='❌ Missing: '+miss.join(',');
      badge.style.background='#FF3B30';
    }
  },2000);
});

function renderMainToolbar(){
  const bar=document.getElementById('mainToolbar');
  if(!bar||!window.IconSystem) return;
  const tools=[
    {id:'media', label:'Media', icon:'media', action:()=>{ if(window.AndroidBridge) AndroidBridge.pickMedia(); else if(window.MediaImportTool) MediaImportTool.importToTimeline(); }},
    {id:'text', label:'Text', icon:'text', action:()=> window.TextTool && TextTool.addTextClip()},
    {id:'audio', label:'Audio', icon:'music', action:()=> console.log('Audio')},
    {id:'zoomOut', label:'Zoom-', icon:'zoomOut', size:20, action:()=> window.ZoomEngine && ZoomEngine.zoomOut()},
    {id:'zoomIn', label:'Zoom+', icon:'zoomIn', size:20, action:()=> window.ZoomEngine && ZoomEngine.zoomIn()},
    {id:'export', label:'Export', icon:'export', active:true, action:()=> console.log('Export')},
  ];
  bar.innerHTML=tools.map(t=>`<button class="tool-item ${t.active?'active':''}" id="btn-${t.id}">${IconSystem.render(t.icon,t.active,t.size||24)}<span>${t.label}</span></button>`).join('');
  tools.forEach(t=>{ document.getElementById(`btn-${t.id}`)?.addEventListener('click', t.action); });
}
function showContextualToolbar(clip){
  const bar=document.getElementById('contextualToolbar'); if(!bar||!window.IconSystem) return;
  const type=clip.type||'video'; const reg=IconSystem.getRegistry(); const tools=reg[type]||reg.video;
  bar.innerHTML=tools.map(n=>`<button class="tool-item" data-tool="${n}">${IconSystem.render(n,false,20)}<span>${n}</span></button>`).join('');
  bar.classList.add('visible');
  bar.querySelectorAll('.tool-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tool=btn.dataset.tool;
      if(navigator.vibrate) navigator.vibrate(30);
      if(tool==='trim'&&window.TrimSplitTool) TrimSplitTool.showTrimUI();
      console.log('Tool',tool,'clip',clip);
    });
  });
}
function hideContextualToolbar(){ const bar=document.getElementById('contextualToolbar'); if(bar) bar.classList.remove('visible'); }
