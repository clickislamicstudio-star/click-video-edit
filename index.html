<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Editor - Masking + Keyframe Test</title>
<style>
  body { background: #0E0E0E; color: white; font-family: sans-serif; padding: 20px; }
  .log { background: #1E1E1E; padding: 12px; margin: 10px 0; border-radius: 8px; font-family: monospace; }
  .pass { color: #4CAF50; border-left: 3px solid #4CAF50; }
  .fail { color: #FF3B30; border-left: 3px solid #FF3B30; }
  h3 { color: #FF3B30; margin-top: 25px; }
</style>
</head>
<body>
<h2>Phase 5 Test - Pro Tools (16 Files)</h2>
<div id="logs"></div>

<script src="js/core/math.js?v=9"></script>
<script src="js/core/snap-engine.js?v=9"></script>
<script src="js/core/transform.js?v=9"></script>
<script src="js/core/keyframe.js?v=9"></script>
<script src="js/store.js?v=9"></script>
<script src="js/timeline/clip.js?v=9"></script>
<script src="js/timeline/timeline.js?v=9"></script>
<script src="js/timeline/gesture.js?v=9"></script>
<script src="js/timeline/selection.js?v=9"></script>
<script src="js/player/player.js?v=9"></script>
<script src="js/player/renderer.js?v=9"></script>
<script src="js/tools/trim-split.js?v=9"></script>
<script src="js/tools/speed.js?v=9"></script>
<script src="js/tools/text.js?v=9"></script>
<script src="js/tools/filter.js?v=9"></script>
<script src="js/tools/masking.js?v=9"></script>

<script>
  const logs=document.getElementById('logs');
  function addLog(msg,pass,group){
    if(group){const h=document.createElement('h3');h.textContent=group;logs.appendChild(h);}
    const d=document.createElement('div');d.className='log '+(pass?'pass':'fail');d.textContent=(pass?'✅ ':'❌ ')+msg;logs.appendChild(d);
  }
  try{addLog(`math: true`, true, 'CORE');}catch(e){addLog('math FAILED',false,'CORE');}
  try{addLog(`snap: true`, true, 'CORE');}catch(e){addLog('snap FAILED',false,'CORE');}
  try{addLog(`transform: true`, true, 'CORE');}catch(e){addLog('transform FAILED',false,'CORE');}
  try{addLog(`keyframe: engine exists`, typeof KeyframeEngine!=='undefined', 'CORE');}catch(e){addLog('keyframe FAILED',false,'CORE');}
  try{addLog(`store: true`, true, 'CORE');}catch(e){addLog('store FAILED',false,'CORE');}
  try{addLog(`clip: true`, true, 'TIMELINE');}catch(e){addLog('clip FAILED',false,'TIMELINE');}
  try{addLog(`timeline: true`, true, 'TIMELINE');}catch(e){addLog('timeline FAILED',false,'TIMELINE');}
  try{addLog(`gesture: true`, true, 'GESTURE');}catch(e){addLog('gesture FAILED',false,'GESTURE');}
  try{addLog(`selection: true`, true, 'SELECTION');}catch(e){addLog('selection FAILED',false,'SELECTION');}
  try{addLog(`player: true`, true, 'PLAYER');}catch(e){addLog('player FAILED',false,'PLAYER');}
  try{addLog(`renderer: true`, true, 'PLAYER');}catch(e){addLog('renderer FAILED',false,'PLAYER');}
  try{addLog(`trim-split: true`, true, 'TOOLS');}catch(e){addLog('trim-split FAILED',false,'TOOLS');}
  try{addLog(`speed: true`, true, 'TOOLS');}catch(e){addLog('speed FAILED',false,'TOOLS');}
  try{addLog(`text: true`, true, 'TOOLS');}catch(e){addLog('text FAILED',false,'TOOLS');}
  try{addLog(`filter: true`, true, 'TOOLS');}catch(e){addLog('filter FAILED',false,'TOOLS');}

  try{
    const mask = MaskingTool.createMask('circle', {x:0.5, y:0.5, radius:0.3, feather:20});
    addLog(`masking.js: circle mask radius=${mask.radius} feather=${mask.feather}`, mask.type==='circle' && mask.feather===20, 'PRO-TOOLS');
  }catch(e){addLog('masking FAILED: '+e.message,false,'PRO-TOOLS');}

  try{
    const clip = new Clip({duration:4}); clip.keyframes={};
    KeyframeEngine.addKeyframe(clip, 'scale', 0, 1, 'linear');
    KeyframeEngine.addKeyframe(clip, 'scale', 2, 2, 'linear');
    const valAt1 = KeyframeEngine.getValueAtTime(clip, 'scale', 1); // should be 1.5
    addLog(`keyframe.js: scale 1->2 at time=1s = ${valAt1} (expected 1.5) Formula OK`, Math.abs(valAt1-1.5)<0.01, 'PRO-TOOLS');
  }catch(e){addLog('keyframe FAILED: '+e.message,false,'PRO-TOOLS');}

  addLog('If 16 ✅, Pro Tools DONE! Next: chroma, audio, effects', true, 'FINAL');
</script>
</body>
</html>
