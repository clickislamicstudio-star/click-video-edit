<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Click v1.2 - Professional Timeline - 28 Files</title>
<meta name="theme-color" content="#FF3B30">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0E0E0E;color:white;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#1A1A1A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A2A2A}header h1{color:#FF3B30;font-size:16px}.btn{background:#2A2A2A;color:white;border:none;padding:8px 14px;border-radius:20px;font-size:13px}.btn-primary{background:#FF3B30}
#playerArea{height:42vh;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px}#playerCanvas{width:90%;max-width:320px;aspect-ratio:9/16;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center}#importBtn{background:#FF3B30;color:white;border:none;padding:12px 24px;border-radius:30px;font-size:14px;margin:10px;cursor:pointer}
#timelineArea{flex:1;background:#1E1E1E;border-top:2px solid #FF3B30;overflow:hidden;position:relative}#timelineArea canvas{display:block}
#toolbar{background:#1A1A1A;padding:8px 0;border-top:1px solid #2A2A2A;overflow-x:auto;white-space:nowrap}.tool-btn{background:transparent;border:none;color:white;padding:8px 12px;min-width:60px;font-size:11px}.tool-icon{width:26px;height:26px;background:#2A2A2A;border-radius:7px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
#badge{position:fixed;top:50px;right:10px;background:#4CAF50;color:white;padding:5px 10px;border-radius:20px;font-size:10px;z-index:100}
#info{position:fixed;bottom:70px;left:10px;right:10px;background:rgba(0,0,0,0.9);color:#AAA;padding:8px 12px;border-radius:10px;font-size:10px;font-family:monospace;z-index:90}
</style>
</head>
<body>
<header><h1>Click v1.2 - Pro Timeline - 28 Files</h1><div><button class="btn" id="langBtn">EN</button><button class="btn btn-primary" id="exportBtn">Export</button></div></header>
<div id="playerArea">
  <div id="playerCanvas"><div style="text-align:center;padding:20px;"><h3 style="color:#FF3B30;margin-bottom:10px;">Professional Timeline</h3><button id="importBtn">📁 Import Video</button><p style="color:#666;font-size:11px;margin-top:8px;">Test: Drag, Trim, Snap, Waveform</p><p style="color:#888;font-size:10px;margin-top:6px;">V1: No Overlap | V2: Can Overlap | Playhead Center</p></div></div>
  <div id="badge">Checking 28 Files...</div>
</div>
<div id="timelineArea"></div>
<div id="info">Timeline: timeToPixel = (clipTime - scrollOffset) * pps | Playhead Fixed Center | Snap 15px | Trim Handles</div>
<div id="toolbar"><div>
<button class="tool-btn"><div class="tool-icon">✂️</div>Trim</button><button class="tool-btn"><div class="tool-icon">⚡</div>Speed</button><button class="tool-btn"><div class="tool-icon">T</div>Text</button><button class="tool-btn"><div class="tool-icon">🎨</div>Filter</button><button class="tool-btn"><div class="tool-icon">⭕</div>Mask</button><button class="tool-btn"><div class="tool-icon">🎵</div>Audio</button><button class="tool-btn"><div class="tool-icon">💬</div>Captions</button>
</div></div>

<script src="js/core/math.js?v=15"></script><script src="js/core/snap-engine.js?v=15"></script><script src="js/core/transform.js?v=15"></script><script src="js/core/keyframe.js?v=15"></script><script src="js/core/i18n.js?v=15"></script><script src="js/core/waveform.js?v=15"></script><script src="js/store.js?v=15"></script><script src="js/hardware.js?v=15"></script><script src="js/timeline/clip.js?v=15"></script><script src="js/timeline/timeline.js?v=15"></script><script src="js/timeline/gesture.js?v=15"></script><script src="js/timeline/selection.js?v=15"></script><script src="js/timeline/timeline-ui.js?v=15"></script><script src="js/timeline/markers.js?v=15"></script><script src="js/player/player.js?v=15"></script><script src="js/player/renderer.js?v=15"></script><script src="js/tools/trim-split.js?v=15"></script><script src="js/tools/speed.js?v=15"></script><script src="js/tools/text.js?v=15"></script><script src="js/tools/filter.js?v=15"></script><script src="js/tools/masking.js?v=15"></script><script src="js/tools/chroma.js?v=15"></script><script src="js/tools/audio.js?v=15"></script><script src="js/tools/effects.js?v=15"></script><script src="js/tools/captions.js?v=15"></script><script src="js/tools/media-import.js?v=15"></script><script src="js/export/export.js?v=15"></script><script src="js/app.js?v=15"></script>

<script>
// Init Pro Timeline
setTimeout(()=>{
  if(window.TimelineUI) TimelineUI.init('timelineArea');
  
  // Add demo clips to show professional timeline
  if(window.TimelineUI && window.Clip) {
    const demoClips = [
      new Clip({id:'c1', track:'V1', startTime:0, duration:3, type:'video', name:'Video1.mp4'}),
      new Clip({id:'c2', track:'V1', startTime:3, duration:2.5, type:'video', name:'Video2.mp4'}),
      new Clip({id:'c3', track:'V2', startTime:1, duration:2, type:'video', name:'PIP Overlay'}),
      new Clip({id:'c4', track:'Text', startTime:0.5, duration:2, type:'text', name:'Hello Text'}),
      new Clip({id:'c5', track:'A1', startTime:0, duration:5.5, type:'audio', name:'Music.mp3', waveform: Array.from({length:80}, ()=>({min:-0.5+Math.random()*0.3, max:0.5-Math.random()*0.3}))})
    ];
    demoClips.forEach(c=>TimelineUI.addClip(c));
  }
}, 500);

document.getElementById('importBtn')?.addEventListener('click', async ()=>{
  if(window.MediaImportTool) {
    const clips = await MediaImportTool.importToTimeline();
    if(window.TimelineUI && clips.length>0) {
      clips.forEach(c=>TimelineUI.addClip(c));
    }
  }
});

setTimeout(()=>{
  const all=['TimelineMath','SnapEngine','TransformEngine','KeyframeEngine','I18n','WaveformEngine','Store','HardwareDetector','Clip','Timeline','Gesture','Selection','TimelineUI','MarkersEngine','Player','Renderer','TrimSplitTool','SpeedTool','TextTool','FilterTool','MaskingTool','ChromaTool','AudioTool','EffectsTool','CaptionsTool','MediaImportTool','ExportEngine','App'];
  const missing=all.filter(n=>typeof window[n]==='undefined');
  const badge=document.getElementById('badge');
  if(missing.length===0){
    badge.textContent='✅ 28 Files - Pro Timeline Ready!';
    badge.style.background='#4CAF50';
    console.log('PRO TIMELINE READY - timeToPixel, Playhead Center, Snap, Trim, Waveform');
  } else {
    badge.textContent='❌ Missing: '+missing.join(',');
    badge.style.background='#FF3B30';
  }
},1500);
</script>
</body>
</html>
