<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Click Video Editor - v1.1 Import + Waveform</title>
<meta name="theme-color" content="#FF3B30">
<link rel="manifest" href="manifest.json">
<style>
  *{margin:0;padding:0;box-sizing:border-box}body{background:#0E0E0E;color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
  header{background:#1A1A1A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A2A2A}header h1{font-size:18px;color:#FF3B30}.header-actions{display:flex;gap:8px}.btn{background:#2A2A2A;color:white;border:none;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}.btn-primary{background:#FF3B30}
  #playerArea{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow-y:auto}#playerCanvas{width:100%;max-width:400px;min-height:60vh;aspect-ratio:9/16;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:10px;flex-direction:column}#welcome{text-align:center;padding:20px;width:100%}#importBtn{background:#FF3B30;color:white;border:none;padding:14px 28px;border-radius:30px;font-size:16px;margin:15px 0;cursor:pointer;box-shadow:0 4px 15px rgba(255,59,48,0.4)}#importBtn:active{transform:scale(0.95)}
  #timelineArea{height:130px;background:#1E1E1E;border-top:1px solid #2A2A2A;padding:10px;overflow-x:auto}.timeline-track{height:28px;background:#2A2A2A;border-radius:6px;margin:4px 0;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#888;position:relative;overflow:hidden}.track-v1{border-left:3px solid #FF3B30}.track-clip{background:#FF3B30;height:100%;border-radius:4px;display:flex;align-items:center;padding:0 6px;color:white;font-size:10px;position:absolute;left:0;top:0}
  #toolbar{background:#1A1A1A;padding:10px 0;border-top:1px solid #2A2A2A;overflow-x:auto;white-space:nowrap}.tool-group{display:inline-flex;gap:4px;padding:0 10px}.tool-btn{background:transparent;border:none;color:white;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:12px;min-width:60px;cursor:pointer}.tool-icon{width:28px;height:28px;background:#2A2A2A;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}.tool-label{font-size:10px;color:#AAA}
  #toolPanel{position:fixed;bottom:90px;left:10px;right:10px;background:#2A2A2A;border-radius:16px;padding:16px;transform:translateY(200%);transition:0.3s;z-index:10}#toolPanel.active{transform:translateY(0)}
  #testBadge{position:fixed;top:60px;right:10px;background:#4CAF50;color:white;padding:6px 12px;border-radius:20px;font-size:11px;font-family:monospace;z-index:100}
  canvas.waveform{width:100%;height:100%;}
</style>
</head>
<body>
<header><h1>Click Video Editor v1.1</h1><div class="header-actions"><button class="btn" id="langBtn">EN</button><button class="btn btn-primary" id="exportBtn">Export</button></div></header>
<div id="playerArea">
  <div id="playerCanvas">
    <div id="welcome">
      <h2 style="color:#FF3B30">Import Media to Start</h2>
      <button id="importBtn">📁 Import Video/Audio</button>
      <p style="color:#888;font-size:12px;">Gallery -> Timeline V1</p>
      <div id="waveformPreview" style="width:100%;height:60px;background:#1E1E1E;border-radius:8px;margin-top:10px;display:none;"><canvas id="waveCanvas" width="300" height="60" style="width:100%;height:100%"></canvas></div>
    </div>
  </div>
  <div id="testBadge">✅ 26 Files - v1.1</div>
</div>
<div id="timelineArea">
  <div class="timeline-track track-v1" id="trackV1">V1 Main - No clips yet. Import to add.</div>
  <div class="timeline-track" id="trackA1">A1 Audio - Waveform will show here</div>
</div>
<div id="toolbar"><div class="tool-group">
<button class="tool-btn" data-tool="trim"><div class="tool-icon">✂️</div><div class="tool-label">Trim</div></button>
<button class="tool-btn" data-tool="speed"><div class="tool-icon">⚡</div><div class="tool-label">Speed</div></button>
<button class="tool-btn" data-tool="text"><div class="tool-icon">T</div><div class="tool-label">Text</div></button>
<button class="tool-btn" data-tool="filter"><div class="tool-icon">🎨</div><div class="tool-label">Filter</div></button>
<button class="tool-btn" data-tool="audio"><div class="tool-icon">🎵</div><div class="tool-label">Audio</div></button>
<button class="tool-btn" data-tool="captions"><div class="tool-icon">💬</div><div class="tool-label">Captions</div></button>
</div></div>
<div id="toolPanel"></div>

<script src="js/core/math.js?v=13"></script><script src="js/core/snap-engine.js?v=13"></script><script src="js/core/transform.js?v=13"></script><script src="js/core/keyframe.js?v=13"></script><script src="js/core/i18n.js?v=13"></script><script src="js/core/waveform.js?v=13"></script><script src="js/store.js?v=13"></script><script src="js/hardware.js?v=13"></script><script src="js/timeline/clip.js?v=13"></script><script src="js/timeline/timeline.js?v=13"></script><script src="js/timeline/gesture.js?v=13"></script><script src="js/timeline/selection.js?v=13"></script><script src="js/player/player.js?v=13"></script><script src="js/player/renderer.js?v=13"></script><script src="js/tools/trim-split.js?v=13"></script><script src="js/tools/speed.js?v=13"></script><script src="js/tools/text.js?v=13"></script><script src="js/tools/filter.js?v=13"></script><script src="js/tools/masking.js?v=13"></script><script src="js/tools/chroma.js?v=13"></script><script src="js/tools/audio.js?v=13"></script><script src="js/tools/effects.js?v=13"></script><script src="js/tools/captions.js?v=13"></script><script src="js/tools/media-import.js?v=13"></script><script src="js/export/export.js?v=13"></script><script src="js/app.js?v=13"></script>

<script>
// Wire import button
document.getElementById('importBtn')?.addEventListener('click', async () => {
  const clips = await MediaImportTool.importToTimeline();
  const trackV1 = document.getElementById('trackV1');
  if(trackV1 && clips.length>0) {
    trackV1.innerHTML = clips.map(c=>`<div class="track-clip" style="width:${Math.min(100, c.duration*10)}%">${c.name.substr(0,15)} ${c.duration.toFixed(1)}s</div>`).join('');
    // Show waveform
    if(clips[0].waveform) {
      const preview = document.getElementById('waveformPreview');
      const canvas = document.getElementById('waveCanvas');
      if(preview && canvas) {
        preview.style.display='block';
        WaveformEngine.drawWaveform(canvas, clips[0].waveform, '#FF3B30');
      }
    }
  }
});
// Final check 26 files
setTimeout(()=>{const all=['TimelineMath','SnapEngine','TransformEngine','KeyframeEngine','I18n','WaveformEngine','Store','HardwareDetector','Clip','Timeline','Gesture','Selection','Player','Renderer','TrimSplitTool','SpeedTool','TextTool','FilterTool','MaskingTool','ChromaTool','AudioTool','EffectsTool','CaptionsTool','MediaImportTool','ExportEngine','App'];const missing=all.filter(n=>typeof window[n]==='undefined');const badge=document.getElementById('testBadge');if(missing.length===0){badge.textContent='✅ 26 Files - v1.1 Ready!';badge.style.background='#4CAF50';}else{badge.textContent='❌ Missing: '+missing.join(',');badge.style.background='#FF3B30';}},1500);
</script>
</body>
</html>
