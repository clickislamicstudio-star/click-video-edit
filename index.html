// ===== 1. math.js v2.3 FINAL - Single Source - Pinch Chain Root - Base + Fix =====
// Base from index.txt File 3: TimelineMath config pps 80, timeToPixel(time,scroll){(time-scroll)*pps}
// Fix: setPps clamped 5-300, sync to ZoomEngine, TimelineUI, Transport, EventBus
console.log('v2.3 - Fixing math.js - Single Source');
if(window.TimelineMath){
  TimelineMath.config.minPps = 5;
  TimelineMath.config.maxPps = 300;
  TimelineMath.setPps = function(pps){
    const clamped = Math.max(this.config.minPps, Math.min(this.config.maxPps, pps));
    this.config.pixelsPerSecond = clamped;
    if(window.ZoomEngine && ZoomEngine.currentPps !== clamped) ZoomEngine.currentPps = clamped;
    if(window.TimelineUI && TimelineUI.pixelsPerSecond !== clamped) TimelineUI.pixelsPerSecond = clamped;
    if(window.Transport && Transport.pps !== clamped) Transport.pps = clamped;
    if(window.EventBus) try{ EventBus.emit(EventBus.EVENTS.TIMELINE_ZOOM, {pps:clamped}); }catch(e){}
    return clamped;
  };
  TimelineMath.getPps = function(){ return this.config.pixelsPerSecond; };
  TimelineMath.getScrollForTime = function(currentTime, viewportWidthPx){ return currentTime - (viewportWidthPx/2/this.config.pixelsPerSecond); };
  console.log('math.js v2.3 FIXED - Single Source - 5 to 300px/s - CapCut Fixed Center');
}

// ===== 2. zoom-engine.js v2.3 FINAL - Visual Zoom Fix - Base + Fix =====
// Base from File: min 5 max 300, zoomBy(scale){newPps=currentPps*scale}, handlePinch(startDist,currentDist){scale=currentDist/startDist}
// Fix: setZoom syncs TimelineMath + TimelineUI + Transport + Ruler + Playhead
if(window.ZoomEngine){
  const origSetZoom = ZoomEngine.setZoom.bind(ZoomEngine);
  ZoomEngine.setZoom = function(pps){
    pps = Math.max(this.minPps, Math.min(this.maxPps, pps));
    if(Math.abs(pps - this.currentPps) < 0.2) return pps;
    this.currentPps = pps;
    if(window.TimelineMath) TimelineMath.config.pixelsPerSecond = pps;
    if(window.TimelineUI){
      TimelineUI.pixelsPerSecond = pps;
      if(TimelineUI.setZoom) TimelineUI.setZoom(pps);
      else if(TimelineUI.render) TimelineUI.render();
    }
    if(window.Transport){
      Transport.pps = pps;
      if(Transport.renderRuler) Transport.renderRuler();
      if(Transport.syncPlayhead) Transport.syncPlayhead();
    }
    if(window.EventBus) try{ EventBus.emit(EventBus.EVENTS.TIMELINE_ZOOM, {pps:pps, zoomLevel:this.getZoomLevel()}); }catch(e){}
    this.updateUI();
    const status=document.getElementById('status');
    if(status) status.textContent='Zoom: '+Math.round(pps)+'px/s - Pinch OK! - '+Math.round((pps/80)*100)+'%';
    setTimeout(()=>{ if(status && status.textContent.includes('Pinch OK')) status.textContent='Ready - Timeline scrolls left when playing - Fixed Center - Pinch 5 to 300px/s - SVG Only'; }, 1500);
    console.log('ZoomEngine v2.3 FIXED - Visual Zoom - pps', Math.round(pps), 'zoom', Math.round((pps/80)*100)+'%');
    return pps;
  };
  console.log('zoom-engine.js v2.3 FIXED - Visual Zoom - Single Source');
}

// ===== 3. gesture.js v2.3 FINAL - Pinch + LongPress Drag - Base + Fix =====
// Base from File: Only LongPress 300ms drag - NO pinch - Pinch was in timeline-ui.js
// Fix: Add pinch logic ported from timeline-ui.js canvas + document backup
if(window.Gesture){
  Gesture.isPinching = false;
  Gesture.startDist = 0;
  Gesture.startPps = 80;
  Gesture.lastScale = 1;
  const origStart = Gesture.onTouchStart.bind(Gesture);
  const origMove = Gesture.onTouchMove.bind(Gesture);
  const origEnd = Gesture.onTouchEnd.bind(Gesture);
  Gesture.onTouchStart = function(e, clip){
    if(e.touches && e.touches.length===2){
      this.isPinching=true;
      const dx=e.touches[0].clientX - e.touches[1].clientX;
      const dy=e.touches[0].clientY - e.touches[1].clientY;
      this.startDist=Math.sqrt(dx*dx+dy*dy);
      this.startPps=window.ZoomEngine ? ZoomEngine.currentPps : 80;
      this.lastScale=1;
      console.log('PINCH START (Gesture v2.3) dist', Math.round(this.startDist), 'pps', this.startPps);
      clearTimeout(this.longPressTimer);
      if(e.cancelable) e.preventDefault();
      return;
    }
    return origStart(e, clip);
  };
  Gesture.onTouchMove = function(e, clip){
    if(e.touches && e.touches.length===2 && this.isPinching){
      const dx=e.touches[0].clientX - e.touches[1].clientX;
      const dy=e.touches[0].clientY - e.touches[1].clientY;
      const curDist=Math.sqrt(dx*dx+dy*dy);
      const scale=curDist/this.startDist;
      if(Math.abs(scale-this.lastScale)<0.01) return;
      this.lastScale=scale;
      console.log('PINCH MOVE (Gesture v2.3) scale', scale.toFixed(3), 'newPps', Math.round(this.startPps*scale));
      if(window.ZoomEngine) ZoomEngine.handlePinch(this.startDist, curDist);
      if(e.cancelable) e.preventDefault();
      clearTimeout(this.longPressTimer);
      return;
    }
    return origMove(e, clip);
  };
  Gesture.onTouchEnd = function(){
    clearTimeout(this.longPressTimer);
    this.isDragging=false;
    this.isPinching=false;
    this.startDist=0;
    return origEnd();
  };
  // Document level backup pinch
  Gesture.init = function(){
    console.log('Gesture v2.3 - Document Level Backup Pinch + LongPress Drag - Ready');
    const els=[document.getElementById('timelineArea'), document.getElementById('rulerCanvas'), document.body, document];
    els.forEach(el=>{
      if(!el || el._pinchBackupV23) return;
      el.addEventListener('touchstart', (e)=>this.onTouchStart(e, null), {passive:false});
      el.addEventListener('touchmove', (e)=>this.onTouchMove(e, null), {passive:false});
      el.addEventListener('touchend', (e)=>this.onTouchEnd(e), {passive:false});
      el._pinchBackupV23=true;
    });
  };
  setTimeout(()=>Gesture.init(), 800);
  console.log('gesture.js v2.3 FIXED - Pinch + LongPress Drag');
}

        }
      }, {passive:false});
      ruler.addEventListener('touchend', (e)=>{ if(e.touches.length<2) this.isPinching=false; });
      ruler._pinchBoundV23=true;
    }
  };
  // Patch render to include min-width fix for visual zoom
  const origRender = TimelineUI.render.bind(TimelineUI);
  TimelineUI.render = function(){
    try{ origRender(); }catch(e){ console.log('Original render error', e); }
    // After original render, fix min-width for pinch visual zoom - CRITICAL FIX
    try{
      const pps=this.pixelsPerSecond||80;
      const maxTime = this.clips && this.clips.length ? Math.max(...this.clips.map(c=>c.startTime+c.duration)) : 10;
      const totalWidth = Math.max(maxTime * pps + 500, window.innerWidth * 2.5);
      // Set min-width on track-content if div mode
      if(this.container){
        this.container.querySelectorAll('.track-content').forEach(el=>{ el.style.minWidth = totalWidth + 'px'; });
      }
      const rulerCanvas=document.getElementById('rulerCanvas');
      if(rulerCanvas) rulerCanvas.style.minWidth = totalWidth + 'px';
      console.log('TimelineUI v2.3 render patched - totalWidth', totalWidth, 'pps', pps, 'clips', this.clips.length);
    }catch(e){ console.log('Render patch error', e); }
  };
  // Patch init to bind pinch
  const origInit = TimelineUI.init.bind(TimelineUI);
  TimelineUI.init = function(id){
    const res = origInit(id);
    setTimeout(()=>{ this.bindPinchEvents(); }, 500);
    return res;
  };
  console.log('timeline-ui.js v2.3 FIXED - CapCut Fixed Center + Roller + Pinch + Outside Handles');
}

// ===== 5. markers.js v2.3 FINAL - Playhead Fixed Center - Base + Fix =====
// Base from File: setPlayheadTime(time){ scrollOffset = time - (screenWidth/2 / pps); if(scrollOffset<0) scrollOffset=0; render(); Player.seekTo(time) }
// Fix: Allow negative scrollOffset for center - CapCut Fixed Center - Timeline scrolls left when playing
if(window.MarkersEngine){
  MarkersEngine.setPlayheadTime = function(time){
    this.playheadTime = time;
    if(window.TimelineUI){
      const screenWidth = TimelineUI.canvas ? TimelineUI.canvas.width/2 : 360;
      // CapCut style: scrollOffset = currentTime - (screenWidth/2 / pps) - Allow negative for center
      TimelineUI.scrollOffset = time - (screenWidth/2 / TimelineUI.pixelsPerSecond);
      // Do NOT clamp to 0 - CapCut allows negative for center - this was bug causing timeline not scrolling left at start
      TimelineUI.render();
    }
    if(window.Player) Player.seekTo(time);
    // Also sync Transport if exists
    if(window.Transport){
      Transport.currentTime = time;
      if(Transport.syncPlayhead) Transport.syncPlayhead();

  };

}

// ===== 7. Transport - CapCut Fixed Center Sync - If Transport exists, patch syncPlayhead =====
if(window.Transport){
  const origSync = Transport.syncPlayhead ? Transport.syncPlayhead.bind(Transport) : null;
  Transport.syncPlayhead = function(){
    // CapCut Fixed Center: Playhead fixed center, Timeline scrolls left - Base file MarkersEngine logic
    const timelineArea=document.getElementById('timelineArea');
    if(timelineArea && this.isPlaying){
      const pps=this.pps||80;
      const containerWidth=timelineArea.clientWidth||360;
      const centerX=containerWidth/2;
      const targetScrollLeft = this.currentTime * pps - centerX + 64;
      timelineArea.scrollLeft = targetScrollLeft;
      const rulerWrap=document.getElementById('rulerCanvas');
      if(rulerWrap) rulerWrap.scrollLeft = targetScrollLeft;
    }
    if(origSync) origSync();
  };
  console.log('Transport v2.3 FIXED - CapCut Fixed Center Sync');
}
