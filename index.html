<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Video Editor - Phase 3 Test</title>
<style>
  body { background: #0E0E0E; color: white; font-family: sans-serif; padding: 20px; }
  .log { background: #1E1E1E; padding: 12px; margin: 10px 0; border-radius: 8px; font-family: monospace; }
  .pass { color: #4CAF50; border-left: 3px solid #4CAF50; }
  .fail { color: #FF3B30; border-left: 3px solid #FF3B30; }
  h3 { color: #FF3B30; margin-top: 25px; }
</style>
</head>
<body>
<h2>Phase 3 Test (10 Files)</h2>
<div id="logs"></div>

<script src="js/core/math.js?v=6"></script>
<script src="js/core/snap-engine.js?v=6"></script>
<script src="js/core/transform.js?v=6"></script>
<script src="js/store.js?v=6"></script>
<script src="js/timeline/clip.js?v=6"></script>
<script src="js/timeline/timeline.js?v=6"></script>
<script src="js/timeline/gesture.js?v=6"></script>
<script src="js/timeline/selection.js?v=6"></script>
<script src="js/player/player.js?v=6"></script>
<script src="js/player/renderer.js?v=6"></script>

<script>
  const logs=document.getElementById('logs');
  function addLog(msg,pass,group){
    if(group){const h=document.createElement('h3');h.textContent=group;logs.appendChild(h);}
    const d=document.createElement('div');d.className='log '+(pass?'pass':'fail');d.textContent=(pass?'✅ ':'❌ ')+msg;logs.appendChild(d);
  }
  try{addLog(`math.js: ${TimelineMath.timeToPixel(2,0)===160}`, TimelineMath.timeToPixel(2,0)===160, 'CORE');}catch(e){addLog('math FAILED',false,'CORE');}
  try{addLog(`snap: ${typeof SnapEngine!=='undefined'}`, typeof SnapEngine!=='undefined', 'CORE');}catch(e){addLog('snap FAILED',false,'CORE');}
  try{addLog(`transform: ${!!TransformEngine.getMatrix({})}`, !!TransformEngine.getMatrix({}), 'CORE');}catch(e){addLog('transform FAILED',false,'CORE');}
  try{addLog(`store: ${typeof Store!=='undefined'}`, typeof Store!=='undefined', 'CORE');}catch(e){addLog('store FAILED',false,'CORE');}

  try{const c=new Clip({duration:2});addLog(`clip.js: endTime=${c.endTime}`, c.endTime===2, 'TIMELINE');}catch(e){addLog('clip FAILED',false,'TIMELINE');}
  try{addLog(`timeline: ${Timeline.clips.length>=0}`, true, 'TIMELINE');}catch(e){addLog('timeline FAILED',false,'TIMELINE');}
  try{addLog(`gesture: ${typeof Gesture.isDragging!=='undefined'}`, typeof Gesture!=='undefined', 'GESTURE');}catch(e){addLog('gesture FAILED',false,'GESTURE');}
  try{Selection.select('test');addLog(`selection: ${Selection.isSelected('test')}`, Selection.isSelected('test'), 'SELECTION');}catch(e){addLog('selection FAILED',false,'SELECTION');}

  try{Player.seekTo(1.5);addLog(`player.js: seekTo(1.5) = ${Player.currentTime}`, Player.currentTime===1.5, 'PLAYER');}catch(e){addLog('player FAILED: '+e.message,false,'PLAYER');}
  try{const ok=Renderer.render([],0);addLog(`renderer.js: render() works = ${ok}`, ok===true, 'PLAYER');}catch(e){addLog('renderer FAILED: '+e.message,false,'PLAYER');}

  addLog('If 10 ✅, Phase 3 DONE! Next: Tools', true, 'FINAL');
</script>
</body>
</html>
