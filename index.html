<script>
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    if(window.TimelineUI && TimelineUI.init) TimelineUI.init('timelineArea');
    if(window.Transport && Transport.init) Transport.init();
    if(window.Renderer && Renderer.init) Renderer.init();
    if(window.Player && Player.init) Player.init();
    if(window.Toolbar && Toolbar.init) Toolbar.init();
    if(window.TransformTool && TransformTool.init) TransformTool.init();
    renderMainToolbar();
    if(window.EventBus){
      EventBus.on(EventBus.EVENTS.CLIP_SELECTED, (clip)=> {
        const c = clip.clip || clip;
        const real = TimelineUI.clips.find(x=>x.id===c.id) || c;
        showContextualToolbar(real);
        if(window.Renderer) Renderer.showClip(real);
      });
      EventBus.on(EventBus.EVENTS.CLIP_DESELECTED, ()=> hideContextualToolbar());
    }
  },500);

  setTimeout(()=>{
    if(!window.TransformEngine) window.TransformEngine = window.TransformTool;
    if(!window.TransformTool) window.TransformTool = window.TransformEngine;
    const need=['EventBus','TimelineMath','IconSystem','Store','Toolbar','TransformEngine','Clip','TimelineUI','Transport','Renderer','Player','TextTool','App'];
    const miss=need.filter(n=>typeof window[n]==='undefined');
    const badge=document.getElementById('badge');
    const info=document.getElementById('info');
    if(miss.length===0){
      badge.textContent='✅ v1.8.4 - Transport + Thin Timeline + Text Restore!';
      badge.style.background='#4CAF50';
      info.textContent='✅ v1.8.4 Ready - EN Default - Domain Ready - Tap Media';
      info.style.color='#4CAF50';
    } else {
      badge.textContent='❌ Missing: '+miss.join(',');
      badge.style.background='#FF3B30';
    }
  },2000);
});
function renderMainToolbar(){
  const bar=document.getElementById('mainToolbar');
  if(!bar||!window.IconSystem) return;
  const tools=[
    {id:'media', label:'Media', icon:'media', action:()=>{ if(window.MediaImportTool) MediaImportTool.importToTimeline(); }},
    {id:'text', label:'Text', icon:'text', action:()=> window.TextTool && TextTool.addTextClip()},
    {id:'audio', label:'Audio', icon:'music', action:()=> window.MediaImportTool && MediaImportTool.importToTimeline()},
    {id:'zoomOut', label:'Zoom-', icon:'zoomOut', action:()=> window.ZoomEngine && ZoomEngine.zoomOut()},
    {id:'zoomIn', label:'Zoom+', icon:'zoomIn', action:()=> window.ZoomEngine && ZoomEngine.zoomIn()},
    {id:'export', label:'Export', icon:'export', active:true, action:()=>{ if(window.Renderer) alert('Export Ready - Phase 4'); }},
  ];
  bar.innerHTML=tools.map(t=>`<button class="tool-item ${t.active?'active':''}" id="btn-${t.id}">${IconSystem.render(t.icon,t.active,22)}<span>${t.label}</span></button>`).join('');
  tools.forEach(t=>{ document.getElementById(`btn-${t.id}`)?.addEventListener('click', t.action); });
}
function showContextualToolbar(clip){ if(window.Toolbar && window.Toolbar.showForClip) window.Toolbar.showForClip(clip); }
function hideContextualToolbar(){ const bar=document.getElementById('contextualToolbar'); if(bar) bar.classList.remove('visible'); if(window.Toolbar && window.Toolbar.hide) window.Toolbar.hide(); if(window.Renderer) Renderer._hideTextOnly(); }
