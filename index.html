<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Click v1.7 - Real Import + Real Player - 36 Files</title>
<meta name="theme-color" content="#FF3B30">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0E0E0E;color:white;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#1A1A1A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A2A2A}header h1{color:#FF3B30;font-size:14px}.btn{background:#2A2A2A;color:white;border:none;padding:8px 14px;border-radius:20px;font-size:12px}.btn-primary{background:#FF3B30}
#playerArea{height:45vh;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;padding:5px}#playerWrap{width:90%;max-width:340px;aspect-ratio:9/16;background:#111;border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}#realVideo{width:100%;height:100%;object-fit:contain;background:#000;display:none}#importBtn{background:#FF3B30;color:white;border:none;padding:14px 28px;border-radius:30px;font-size:14px;cursor:pointer;z-index:5}#importBtn:active{transform:scale(0.95)}#playOverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;display:none;z-index:4;cursor:pointer;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
#timelineArea{flex:1;background:#1E1E1E;border-top:2px solid #FF3B30;overflow:hidden;position:relative}#timelineArea canvas{display:block}
#toolbar{background:#1A1A1A;padding:8px 0;border-top:1px solid #2A2A2A;overflow-x:auto;white-space:nowrap}.tool-btn{background:transparent;border:none;color:white;padding:8px 12px;min-width:60px;font-size:11px}.tool-icon{width:26px;height:26px;background:#2A2A2A;border-radius:7px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
#badge{position:fixed;top:50px;right:10px;background:#4CAF50;color:white;padding:5px 10px;border-radius:20px;font-size:10px;z-index:100;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#info{position:fixed;bottom:70px;left:10px;right:10px;background:rgba(0,0,0,0.9);color:#FF3B30;padding:8px 12px;border-radius:10px;font-size:10px;font-family:monospace;z-index:90;text-align:center}
#status{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);color:#0F0;padding:4px 8px;border-radius:10px;font-size:9px;z-index:6}
</style>
</head>
<body>
<header><h1>Click v1.7 - Real Import - 36 Files</h1><div><button class="btn" id="langBtn">EN</button><button class="btn btn-primary" id="exportBtn">Export</button></div></header>
<div id="playerArea">
  <div id="playerWrap">
    <video id="realVideo" playsinline></video>
    <button id="importBtn">📁 Import Video</button>
    <div id="playOverlay">▶️</div>
    <div id="status">Ready - Import to Start</div>
  </div>
  <div id="badge">Checking 36 Files...</div>
</div>
<div id="contextualToolbar" style="position:fixed;bottom:70px;left:0;right:0;height:56px;background:#1E1E1E;transform:translateX(100%);transition:transform 0.3s;z-index:100;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;"></div>
<div id="mainToolbar" style="position:fixed;bottom:0;left:0;right:0;height:70px;background:#121212;display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:99;border-top:1px solid #222;">
  <button onclick="MediaImportTool.importToTimeline()" style="background:#2A2A2A;border:none;color:#FFF;padding:10px 16px;border-radius:8px;">📁 Media</button>
  <button onclick="TextTool.addTextClip()" style="background:#2A2A2A;border:none;color:#FFF;padding:10px 16px;border-radius:8px;">📝 Text</button>
  <button onclick="ZoomEngine.zoomOut()" style="background:#2A2A2A;border:none;color:#FFF;padding:10px 12px;border-radius:8px;">🔍-</button>
  <button onclick="ZoomEngine.zoomIn()" style="background:#2A2A2A;border:none;color:#FFF;padding:10px 12px;border-radius:8px;">🔍+</button>
  <button id="exportBtn" style="background:#FF3B30;border:none;color:#FFF;padding:10px 16px;border-radius:8px;">⬆️ Export</button>
</div>
<div id="textOverlay" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:32px;font-weight:bold;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,0.8);background:rgba(0,0,0,0.3);padding:8px 16px;border-radius:8px;pointer-events:none;display:none;z-index:20;max-width:80%;"></div>
<div id="timelineArea"></div>
<div id="info">Import Real Video -> Player Plays Real Video -> Timeline Shows Real Duration</div>
<div id="toolbar"><div>
<button class="tool-btn" onclick="ZoomEngine.zoomOut()"><div class="tool-icon">➖</div>ZoomOut</button><button class="tool-btn" onclick="ZoomEngine.zoomIn()"><div class="tool-icon">➕</div>ZoomIn</button><button class="tool-btn" id="btnTrim"><div class="tool-icon">✂️</div>Trim</button><button class="tool-btn"><div class="tool-icon">⚡</div>Speed</button><button class="tool-btn"><div class="tool-icon">T</div>Text</button><button class="tool-btn"><div class="tool-icon">🎨</div>Filter</button><button class="tool-btn"><div class="tool-icon">⭕</div>Mask</button><button class="tool-btn"><div class="tool-icon">🎵</div>Audio</button>
</div></div>

<script src="js/core/math.js?v=20"></script><script src="js/core/snap-engine.js?v=20"></script><script src="js/core/transform.js?v=20"></script><script src="js/core/keyframe.js?v=20"></script><script src="js/core/i18n.js?v=20"></script><script src="js/core/waveform.js?v=20"></script><script src="js/core/waveform-renderer.js?v=20"></script><script src="js/store.js?v=20"></script><script src="js/hardware.js?v=20"></script><script src="js/timeline/clip.js?v=20"></script><script src="js/timeline/timeline.js?v=20"></script><script src="js/timeline/gesture.js?v=20"></script><script src="js/timeline/selection.js?v=20"></script><script src="js/timeline/timeline-ui.js?v=20"></script><script src="js/timeline/zoom-engine.js?v=20"></script><script src="js/timeline/markers.js?v=20"></script><script src="js/player/player.js?v=20"></script><script src="js/player/renderer.js?v=20"></script><script src="js/tools/trim-split.js?v=20"></script><script src="js/tools/speed.js?v=20"></script><script src="js/tools/text.js?v=20"></script><script src="js/tools/filter.js?v=20"></script><script src="js/tools/masking.js?v=20"></script><script src="js/tools/chroma.js?v=20"></script><script src="js/tools/audio.js?v=20"></script><script src="js/tools/effects.js?v=20"></script><script src="js/tools/captions.js?v=20"></script><script src="js/tools/whisper-engine.js?v=20"></script><script src="js/tools/media-import.js?v=20"></script><script src="js/export/export.js?v=20"></script><script src="js/export/ffmpeg-engine.js?v=20"></script><script src="js/export/export-queue.js?v=20"></script><script src="js/app.js?v=20"></script>

<script>
// Real Import + Real Player wiring
setTimeout(()=>{
  if(window.TimelineUI) TimelineUI.init('timelineArea');
  if(window.ZoomEngine) ZoomEngine.init();
  if(window.Player) Player.init();
}, 600);

document.getElementById('importBtn')?.addEventListener('click', async ()=>{
  const status = document.getElementById('status');
  if(status) status.textContent = 'Opening Gallery...';
  
  if(window.MediaImportTool) {
    const clips = await MediaImportTool.importToTimeline();
    if(clips && clips.length>0) {
      if(status) status.textContent = `Imported ${clips.length} files - Playing...`;
      document.getElementById('importBtn').style.display = 'none';
      document.getElementById('realVideo').style.display = 'block';
    } else {
      if(status) status.textContent = 'No file selected';
    }
  }
});

document.getElementById('realVideo')?.addEventListener('click', ()=>{
  if(window.Player) Player.togglePlay();
});

document.getElementById('playOverlay')?.addEventListener('click', ()=>{
  if(window.Player) Player.togglePlay();
});

setTimeout(()=>{
  const all=['TimelineMath','SnapEngine','TransformEngine','KeyframeEngine','I18n','WaveformEngine','WaveformRenderer','Store','HardwareDetector','Clip','Timeline','Gesture','Selection','TimelineUI','ZoomEngine','MarkersEngine','Player','Renderer','TrimSplitTool','SpeedTool','TextTool','FilterTool','MaskingTool','ChromaTool','AudioTool','EffectsTool','CaptionsTool','WhisperEngine','MediaImportTool','ExportEngine','FFmpegEngine','ExportQueue','App'];
  const missing=all.filter(n=>typeof window[n]==='undefined');
  const badge=document.getElementById('badge');
  if(missing.length===0){
    badge.textContent='✅ 36 Files - Real Import Ready!';
    badge.style.background='#4CAF50';
    console.log('REAL IMPORT READY - No dummy clips');
  } else {
    badge.textContent='❌ Missing: '+missing.join(',');
    badge.style.background='#FF3B30';
  }
},1500);
</script>
</body>
</html>
