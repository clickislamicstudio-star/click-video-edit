*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0E0E;color:white;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#1A1A1A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A2A2A;height:56px}

.btn{background:#2A2A2A;color:white;border:none;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all 0.2s}
.btn:active{transform:scale(0.95)}

#importBtn{background:#FF3B30;color:white;border:none;padding:14px 28px;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;z-index:5;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(255,59,48,0.3)}
#importBtn:active{transform:scale(0.95)}
#playOverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;display:none;z-index:4;cursor:pointer;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
#timelineArea{flex:1;background:#1E1E1E;border-top:2px solid #FF3B30;overflow:hidden;position:relative}
#timelineArea canvas{display:block;width:100%;height:100%}
#contextualToolbar{position:fixed;bottom:72px;left:0;right:0;height:64px;background:#1E1E1E;transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);z-index:100;display:flex;align-items:center;gap:4px;padding:0 12px;overflow-x:auto;white-space:nowrap;border-top:1px solid #FF3B30;scrollbar-width:none}
#contextualToolbar::-webkit-scrollbar{display:none}
#contextualToolbar.visible{transform:translateX(0)}
#mainToolbar{position:fixed;bottom:0;left:0;right:0;height:72px;background:#121212;display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:99;border-top:1px solid #222}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:none;color:#A0A0A0;padding:8px 14px;border-radius:10px;cursor:pointer;min-width:56px;transition:all 0.2s}
.tool-item.active{color:#FF3B30;background:rgba(255,59,48,0.12)}
.tool-item svg{width:24px;height:24px}
.tool-item span{font-size:10px;font-weight:500}
#badge{position:fixed;top:60px;right:10px;background:#4CAF50;color:white;padding:6px 12px;border-radius:20px;font-size:11px;z-index:100;max-width:75vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
#info{position:fixed;bottom:80px;left:10px;right:10px;background:rgba(0,0,0,0.85);color:#FF3B30;padding:8px 12px;border-radius:10px;font-size:10px;font-family:monospace;z-index:90;text-align:center;border:1px solid rgba(255,59,48,0.2)}
#status{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);color:#0F0;padding:4px 8px;border-radius:10px;font-size:9px;z-index:6}
#textOverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:32px;font-weight:bold;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,0.8);background:rgba(0,0,0,0.3);padding:8px 16px;border-radius:8px;pointer-events:none;display:none;z-index:20;max-width:80%;}

  <h1>Click v1.8 - Decoupled - Android Ready</h1>
  <div style="display:flex;gap:8px">
    <button class="btn" id="langBtn">EN</button>
    <button class="btn btn-primary" id="exportBtnTop">Export</button>

<script>
// Phase 0 Wiring + New Toolbar Rendering
document.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 Click v1.8 Phase 0 Booting...');

  // Init TimelineUI with fixed PPS
  setTimeout(()=>{
    if(window.TimelineUI) {
      // Fix: Use single source PPS
      if(window.TimelineMath) TimelineUI.pixelsPerSecond = TimelineMath.getPps();
      TimelineUI.init('timelineArea');
      console.log('TimelineUI init with PPS:', TimelineMath.getPps());
    }
    if(window.ZoomEngine) ZoomEngine.init();
    if(window.Player) Player.init();
    if(window.Store) Store.init();
    
    // Render Main Toolbar with IconSystem
    renderMainToolbar();
    
    // Listen to Selection via EventBus
    if(window.EventBus) {
      EventBus.on(EventBus.EVENTS.CLIP_SELECTED, (clip) => {
        console.log('EventBus: Clip Selected', clip);
        showContextualToolbar(clip);
      });
      EventBus.on(EventBus.EVENTS.CLIP_DESELECTED, () => {
        hideContextualToolbar();
      });
      EventBus.on(EventBus.EVENTS.TIMELINE_ZOOM, (data) => {
        console.log('EventBus: Zoom', data.pps);
        if(window.TimelineUI) {
          TimelineUI.pixelsPerSecond = data.pps;
          TimelineUI.render();
        }
      });
    }
  }, 600);

  // Import Button
  document.getElementById('importBtn')?.addEventListener('click', async ()=>{
    const status = document.getElementById('status');
    if(status) status.textContent = 'Opening Gallery...';
    if(window.AndroidBridge) AndroidBridge.pickMedia();
    else if(window.MediaImportTool) {
      const clips = await MediaImportTool.importToTimeline();
      if(clips && clips.length>0) {
        if(status) status.textContent = `Imported ${clips.length} files`;
        document.getElementById('importBtn').style.display = 'none';
        document.getElementById('realVideo').style.display = 'block';
        AndroidBridge.vibrate(50);
      } else {
        if(status) status.textContent = 'No file selected';
      }
    }
  });

  document.getElementById('realVideo')?.addEventListener('click', ()=>{ if(window.Player) Player.togglePlay(); });
  document.getElementById('playOverlay')?.addEventListener('click', ()=>{ if(window.Player) Player.togglePlay(); });

  // Badge Check
  setTimeout(()=>{
    const required = ['EventBus','TimelineMath','SnapEngine','IconSystem','AndroidBridge','TransformEngine','KeyframeEngine','I18n','WaveformEngine','WaveformRenderer','Store','HardwareDetector','Clip','Timeline','Gesture','Selection','TimelineUI','ZoomEngine','MarkersEngine','Player','Renderer','Toolbar','TrimSplitTool','SpeedTool','TextTool','FilterTool','MaskingTool','ChromaTool','AudioTool','EffectsTool','CaptionsTool','WhisperEngine','MediaImportTool','ExportEngine','FFmpegEngine','ExportQueue','App'];
    const missing = required.filter(n=>typeof window[n]==='undefined');
    const badge = document.getElementById('badge');
    const info = document.getElementById('info');
    if(missing.length===0){
      badge.textContent='✅ v1.8 Decoupled - 38 Files - Android Ready!';
      badge.style.background='#4CAF50';
      info.textContent='Phase 0 Complete: EventBus + Snap Real + Icon M3 + Bridge Ready';
      console.log('✅ Phase 0 READY - No missing');
    } else {
      badge.textContent='❌ Missing: '+missing.join(',');
      badge.style.background='#FF3B30';
      console.error('Missing', missing);
    }
  },1800);
});

function renderMainToolbar() {
  const bar = document.getElementById('mainToolbar');
  if(!bar || !window.IconSystem) return;
  
  const tools = [
    {id:'media', label:'Media', icon:'media', action:()=>{ if(window.AndroidBridge) AndroidBridge.pickMedia(); else MediaImportTool.importToTimeline(); }},
    {id:'text', label:'Text', icon:'text', action:()=> TextTool.addTextClip()},
    {id:'audio', label:'Audio', icon:'music', action:()=> console.log('Audio')},
    {id:'zoomOut', label:'Zoom-', icon:'zoomOut', size:20, action:()=> ZoomEngine.zoomOut()},
    {id:'zoomIn', label:'Zoom+', icon:'zoomIn', size:20, action:()=> ZoomEngine.zoomIn()},
    {id:'export', label:'Export', icon:'export', active:true, action:()=> console.log('Export')},
  ];
  
  bar.innerHTML = tools.map(t => `
    <button class="tool-item ${t.active?'active':''}" id="btn-${t.id}">
      ${IconSystem.render(t.icon, t.active, t.size||24)}
      <span>${t.label}</span>
    </button>
  `).join('');
  
  tools.forEach(t => {
    document.getElementById(`btn-${t.id}`)?.addEventListener('click', t.action);
  });
}

function showContextualToolbar(clip) {
  const bar = document.getElementById('contextualToolbar');
  if(!bar || !window.IconSystem) return;
  
  const type = clip.type || clip.clipType || 'video';
  const registry = IconSystem.getRegistry();
  const tools = registry[type] || registry['video'];
  
  bar.innerHTML = tools.map(name => `
    <button class="tool-item" data-tool="${name}">
      ${IconSystem.render(name, false, 20)}
      <span>${name}</span>
    </button>
  `).join('');
  
  bar.classList.add('visible');
  
  // Bind actions
  bar.querySelectorAll('.tool-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const tool = btn.dataset.tool;
      console.log('Contextual Tool:', tool, 'for', clip);
      if(window.AndroidBridge) AndroidBridge.vibrate(30);
      // Dispatch via Store
      if(window.Store) Store.dispatch({type:'TOOL_CLICK', payload:{tool, clipId: clip.id || clip.name}});
      // Call actual tool if exists
      if(tool==='trim' && window.TrimSplitTool) TrimSplitTool.showTrimUI();
      if(tool==='delete' && window.Timeline) {
        // Delete logic
        const state = Store.getState();
        console.log('Delete', state.selection.selectedClipId);
      }
    });
  });
  
  if(window.EventBus) EventBus.emit(EventBus.EVENTS.TOOLBAR_CHANGE, {mode: type, tools});
}

function hideContextualToolbar() {
  const bar = document.getElementById('contextualToolbar');
  if(bar) bar.classList.remove('visible');
}
</script>
