<script>
document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    if(window.ZoomEngine) ZoomEngine.init();
    if(window.TimelineUI) TimelineUI.init('timelineArea');
    if(window.Transport) Transport.init();
    if(window.Renderer) Renderer.init();
    if(window.Player) Player.init();
    if(window.Toolbar) Toolbar.init();
    renderMainToolbar();
    if(window.EventBus){
      EventBus.on(EventBus.EVENTS.CLIP_SELECTED, (clip)=> {
        const c = clip.clip || clip;
        const real = TimelineUI.clips.find(x=>x.id===c.id) || c;
        showContextualToolbar(real);
        if(window.Renderer) Renderer.showClip(real);
      });
      EventBus.on(EventBus.EVENTS.CLIP_DESELECTED, ()=> hideContextualToolbar());
    }
  },500);
  setTimeout(()=>{
    const need=['EventBus','TimelineMath','IconSystem','Store','Toolbar','TransformEngine','Clip','TimelineUI','Transport','ZoomEngine','Renderer','Player','TextTool','App'];
    const miss=need.filter(n=>typeof window[n]==='undefined');
    const badge=document.getElementById('badge');
    const info=document.getElementById('info');
    if(miss.length===0){
      badge.textContent='✅ v1.8.5 - Pro Order + Waveform + No Autoplay!';
      badge.style.background='#4CAF50';
      info.textContent='✅ v1.8.5 - Media|Audio|Text|PIP - EN Default - Domain Ready';
      info.style.color='#4CAF50';
    } else {
      badge.textContent='❌ Missing: '+miss.join(',');
      badge.style.background='#FF3B30';
    }
  },2000);
});
function renderMainToolbar(){
  const bar=document.getElementById('mainToolbar');
  if(!bar||!window.IconSystem) return;
  const tools=[
    {id:'media', label:'Media', icon:'media', desc:'Video+Photo Main', action:()=>MediaImportTool.importToTimeline()},
    {id:'audio', label:'Audio', icon:'music', desc:'BGM + Gallery', action:()=>MediaImportTool.importToTimeline('audio')},
    {id:'text', label:'Text', icon:'text', desc:'Auto Captions', action:()=>TextTool.addTextClip()},
    {id:'pip', label:'PIP', icon:'transform', desc:'Overlay - Only with video', action:()=>MediaImportTool.importToTimeline('pip')},
    {id:'mic', label:'Mic', icon:'mic', desc:'Voiceover -> Audio', action:()=>MicTool.startRecording()},
    {id:'camera', label:'Camera', icon:'camera', desc:'Record -> Media', action:()=>CameraTool.startRecording()},
    {id:'export', label:'Export', icon:'export', active:true, action:()=>alert('Export - Phase 4')},
  ];
  bar.innerHTML=tools.map(t=>`<button class="tool-item ${t.active?'active':''}" id="btn-${t.id}" title="${t.desc}">${IconSystem.render(t.icon,t.active,20)}<span>${t.label}</span></button>`).join('');
  tools.forEach(t=>{ document.getElementById(`btn-${t.id}`)?.addEventListener('click', t.action); });
}
function showContextualToolbar(clip){ if(window.Toolbar && window.Toolbar.showForClip) window.Toolbar.showForClip(clip); }
function hideContextualToolbar(){ const bar=document.getElementById('contextualToolbar'); if(bar) bar.classList.remove('visible'); if(window.Toolbar) Toolbar.hide(); if(window.Renderer) Renderer._hideTextOnly(); }
</script>
